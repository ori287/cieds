<title>CIEDs Navi — PM / ICD / CRT</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--ink:#0f172a;--sub:#475569;--muted:#94a3b8;--teal:#0d9488;--teal-d:#0f766e;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.96);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:2px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.totals{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;background:#eef2f6;border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:var(--sans)}
.seg button.active{background:#fff;color:var(--teal-d);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px 36px;font-size:14px;font-family:var(--sans);outline:none;color:var(--ink)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.searchbox .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px;display:none;line-height:0}
.clearbtn:hover{background:#f1f5f9;color:var(--sub)}
.filterlabel{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:10px 0 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch}

.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:#94a3b8;background:#f8fafc}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.chip .n{font-family:var(--mono);margin-left:6px;color:var(--muted)}.chip.active .n{color:#ccfbf1}
.chip.dev.active{background:#334155;border-color:#334155}.chip.dev.active .n{color:#cbd5e1}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 12px}
.addbtn{border:0;background:var(--teal);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:var(--sans)}
.addbtn:hover{background:var(--teal-d)}
details.datamenu{position:relative}
details.datamenu>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--sub);padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;user-select:none}
details.datamenu>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:6px;min-width:210px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;font-size:13px;color:var(--ink);border-radius:8px;cursor:pointer;font-family:var(--sans)}
.menu button:hover{background:#f1f5f9}.menu button.danger{color:#be123c}
main{padding:12px 0 40px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 12px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cardrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.term{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.35;margin:0}

.fn{font-size:15px;font-weight:700;line-height:1.4;margin:0}
.cardtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px;border-radius:6px;line-height:0}
.iconbtn:hover{background:#f1f5f9;color:var(--sub)}
.metarow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10px;font-weight:600;color:#64748b;background:#f1f5f9;border-radius:5px;padding:2px 7px}
.tag.mk{color:#7c2d12;background:#ffedd5}
.en{font-family:var(--mono);font-size:12px;color:var(--muted);margin:5px 0 0}
.short{font-size:14px;line-height:1.6;color:var(--ink);margin:8px 0 0}
.vgrid{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:8px}
.vrow{display:grid;grid-template-columns:6.5em 1fr;gap:8px;padding:4px 0;align-items:baseline}
.vrow+.vrow{border-top:1px solid #f1f5f9}
.vlabel{font-size:11px;font-weight:700;color:var(--teal-d)}
.vval{font-size:13px;line-height:1.5;color:var(--ink)}
.vval.none{color:#cbd5e1}
.note{font-size:12px;line-height:1.6;color:var(--sub);margin:9px 0 0;background:#f8fafc;border-radius:8px;padding:8px 10px}
.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:12px;padding:40px 16px;text-align:center}
.empty p{margin:0}.empty .big{font-size:14px;font-weight:600;color:var(--sub)}.empty .sm{font-size:12px;color:var(--muted);margin-top:4px}
.disclaimer{text-align:center;font-size:12px;line-height:1.7;color:var(--muted);margin-top:32px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}

.modal h2{font-size:16px;margin:0 0 14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;background:#fff}
.field textarea{min-height:60px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.row2{display:flex;gap:8px}.row2 .field{flex:1}
.modalbtns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--sans)}
.btn.primary{background:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;border-color:#cbd5e1;color:var(--sub)}.btn.ghost:hover{background:#f8fafc}
.btn.del{background:#fff;border-color:#fecdd3;color:#be123c;flex:0 0 auto;padding:11px 14px}.btn.del:hover{background:#fff1f2}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f766e;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.syncstat{font-family:var(--mono);font-size:11px;color:#0f766e;margin:-6px 0 12px}.synchelp{font-size:12px;line-height:1.6;color:var(--sub);margin:0 0 10px;background:#f0fdfa;border-radius:8px;padding:9px 10px}.syncstate{font-size:13px;margin:0 0 12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.eyebrow{letter-spacing:.02em;font-size:11px;margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1;color:#12324e;margin:0}
.titlerow{margin-top:3px;align-items:flex-end}
.totals{font-size:11px}
.suggestbox{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);z-index:45;max-height:min(50vh,340px);overflow:auto;display:none}
.suggestbox.open{display:block}
.sugg{display:flex;align-items:baseline;gap:8px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.sugg:last-child{border-bottom:0}.sugg:active{background:#f0fdfa}
.sugg .st{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink)}
.sugg .sa{font-family:var(--mono);font-size:12px;color:var(--teal)}
.sugg .sc{margin-left:auto;font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}

.cardrow{cursor:pointer}
.short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detailmodal{max-height:88vh;overflow:auto}

.star:hover{color:#94a3b8}.star.on{color:#f59e0b}

<body>
<header>
 <div class="wrap" style="padding-top:14px;padding-bottom:6px">
  <div class="hdrrow">
   <div class="hdrtext"><h1>CIEDs Navi</h1><p class="eyebrow">Pacemaker | ICD | CRT</p></div>
   <span class="totals" id="totals"></span>
  </div>
  <div class="seg"><button id="segG" class="active">用語集</button><button id="segF">メーカー機能名</button></div>
  <div class="searchbox">
   <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
   <input id="search" type="text" aria-label="検索" autocomplete="off"/>
   <button class="clearbtn" id="clear" aria-label="クリア"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
   <div class="suggestbox" id="suggest"></div>
  </div>
  <div class="chips" id="modechips" style="margin-top:10px"></div>
  <div id="glossFilters">
   <p class="filterlabel">対象デバイス</p><div class="chips" id="devchips"></div>
   <p class="filterlabel">カテゴリ</p><div class="chips" id="chips"></div>
  </div>
  <div id="featFilters" style="display:none">
   <p class="filterlabel">メーカー</p><div class="chips" id="fmkchips"></div>
   <p class="filterlabel">機能カテゴリ</p><div class="chips" id="fchips"></div>
  </div>
  <div class="actions">
   <button class="addbtn" id="openAdd">＋ 追加</button>
   <details class="datamenu" id="dataMenu"><summary>データ ▾</summary>
    <div class="menu">
     <button id="refreshBtn">☁ 最新版に更新（マスター再取得）</button>
     <button id="exportBtn">変更を書き出し（JSON）</button>
     <button id="importBtn">変更を読み込み</button>
     <button id="resetBtn" class="danger">変更をリセット（マスターに戻す）</button>
    </div>
   </details>
  </div>
 </div>
</header>
<main class="wrap">
 <div class="sortbar"><select id="sortSel" class="fsel sortsel"></select></div>
 <p class="count" id="count"></p>
 <p id="syncStatus" class="syncstat"></p>
 <ul class="list" id="list"></ul>
 <p class="disclaimer" id="disc"></p>
</main>

  <button class="btn primary" id="saveBtn">保存</button>
 </div>
</div></div>
<div class="overlay" id="detailOverlay"><div class="modal detailmodal" role="dialog" aria-modal="true">
 <div id="detailBody"></div>
 <div class="modalbtns">
  <button class="btn ghost" id="d_edit">編集</button>
  <button class="btn primary" id="d_close">閉じる</button>
 </div>
</div></div>

eneral","short":"心房活動を感知して一定のAV delay後に心室刺激する追従型ペーシング。VAT/VDD系の概念。","tags":"PM / General / atrial-synchronized / ventricular / pacing / threshold / capture"},{"term":"心房・心室順次ペーシング","en":"atrio-ventricular sequential pacing","abbr":"DVI","cat":"モード","device":"PM","maker":"General","short":"心房刺激後に設定AV delayを置いて心室刺激するAV sequential pacing。","tags":"PM / General / atrio-ventricular / sequential / pacing / threshold / capture"},{"term":"心房同期心室抑制ペーシング","en":"atrial-synchronized ventricular-inhibited pacing","abbr":"VDD","cat":"ペーシング","device":"PM","maker":"General","short":"心房を感知して心室刺激を準備し、AV delay内に自己心室波があれば心室刺激を抑制するVDD型動作。","tags":"PM / General / atrial-synchronized / ventricular-inhibited / pacing / threshold / capture"},{"term":"心房用Jリード","en":"atrial J lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"先端がJ字状に湾曲した心房リード。右心耳に引っ掛けて安定して留置できる形状で、受動的固定で用いられることが多い。","tags":"Lead / PM / ICD / CRT / General / atrial / lead / threshold / capture"},{"term":"心房抑制心房ペーシング","en":"P-wave inhibited atrial pacing","abbr":"AAI","cat":"モード","device":"PM","maker":"General","short":"心房自己波を感知すると心房刺激を抑制するAAIペーシング。","tags":"PM / General / P-wave / inhibited / atrial / pacing / threshold / capture"},{"term":"スタイレット","en":"stylet","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード内腔に通して操作性と形状を与える細い鋼線。挿入や位置決めの際に用い、留置後は抜去する。先端を曲げて向きを調整できる。","tags":"Procedure / PM / ICD / CRT / General / stylet / threshold / capture"},{"term":"ストークス・アダムス症候群","en":"Stokes-Adams syndrome","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"高度徐脈・一過性心停止などによる脳低灌流で失神や痙攣を来す発作。","tags":"Clinical / PM / ICD / CRT / General / Stokes-Adams / syndrome"},{"term":"生体適性","en":"biocompatibility","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"材料が体内で過度な炎症・毒性・血栓形成等を起こしにくい性質。biocompatibility。","tags":"Device / PM / ICD / CRT / General / biocompatibility"},{"term":"生理的ペーシング","en":"physiological pacing","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"AV同期や自然な心室興奮順序など、本来の生理に近い循環動態を目指すペーシング概念。","tags":"PM / General / physiological / pacing / threshold / capture"},{"term":"絶縁体","en":"insulation","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"導体を覆う高抵抗の被膜（シリコーンやポリウレタン等）。損傷すると電流が漏れてインピーダンスが低下し、オーバーセンシングや捕捉不全を招く。","tags":"Lead / PM / ICD / CRT / General / insulation / noise / oversensing / lead trouble / threshold / capture"},{"term":"絶縁体亀裂","en":"insulation fracture","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード絶縁被覆の破損。電流漏れ、低インピーダンス、ノイズ等の原因となる。","tags":"Trouble / PM / ICD / CRT / General / insulation / fracture / noise / oversensing / lead trouble 被覆損傷 insulation breach"},{"term":"絶対不応期","en":"absolute refractory period","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"直前の興奮の直後で、どれほど強い刺激でも新たな活動電位を生じない期間。心筋を保護し、期外刺激による頻拍を防ぐ生理的な仕組み。","tags":"EP / PM / ICD / CRT / General / absolute / refractory / period ARP blanking"},{"term":"設定レート","en":"rate / pacing rate","abbr":"","cat":"AV・タイミング","device":"PM","maker":"General","short":"デバイスにプログラムするペーシング速度。下限レートや上限レート等がある。","tags":"PM / General / rate / pacing / threshold / capture"},{"term":"センシング不全","en":"sensing failure","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"適切な自己波認識ができない状態の総称。undersensingとoversensingの双方を含む。","tags":"Trouble / PM / ICD / CRT / General / sensing / failure / noise / oversensing / lead trouble"},{"term":"総機能回復時間","en":"total recovery time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"オーバードライブ刺激終了から最初の自己興奮までを含めた洞結節機能評価指標の古典的表現。","tags":"EP / PM / ICD / CRT / General / total / recovery / time"},{"term":"双極リード","en":"bipolar lead","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"tipとringの2電極間でセンシング/刺激するリード。局所信号を得やすくEMI/筋電位の影響を受けにくい。","tags":"Lead / PM / ICD / CRT / General / bipolar / lead / threshold / capture バイポーラ bipolar"},{"term":"脱 オーバーセンシングや一時的な非同期化を起こしうる。","tags":"Trouble / PM / ICD / CRT / General / electromagnetic / interference"},{"term":"電池交換時期","en":"elective replacement time","abbr":"ERT","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"電池消耗が進み、計画的なジェネレータ交換を検討する段階。ERT/RRTなど表現はメーカーで異なる。","tags":"Battery / PM / ICD / CRT / General / elective / replacement / time"},{"term":"電池交換指示信号","en":"elective replacement indicator","abbr":"ERI","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"電池残量の低下を知らせる表示の総称。マグネットレートの変化や専用アラートで示され、ERI／RRTに相当する。検知したら速やかに交換を計画する。","tags":"Battery / PM / ICD / CRT / General / elective / replacement / indicator"},{"term":"伝導","en":"conduction","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心筋を興奮（脱分極波）が伝わっていくこと。洞結節→心房→房室結節→ヒス束→脚→心室と伝わり、この経路の障害がブロックや不整脈を生む。","tags":"EP / PM / ICD / CRT / General / conduction"},{"term":"洞機能不全症候群","en":"sick sinus syndrome","abbr":"SSS","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"洞徐脈、洞停止、洞房ブロック、徐脈頻脈症候群などを含む洞結節機能障害。SSS/SND。","tags":"Clinical / PM / ICD / CRT / General / sick / sinus / syndrome"},{"term":"洞結節機能回復時間","en":"sinus node recovery time","abbr":"SNRT / SRT","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"心房オーバードライブ刺激終了から最初の洞性興奮までの時間。SNRT。","tags":"EP / PM / ICD / CRT / General / sinus / node / recovery / time"},{"term":"同軸リード","en":"coaxial lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"内側導体と外側導体を同心円状に配置した双極リード構造。細径化しやすい一方、被膜が損傷すると内外の導体が短絡することがある。","tags":"Lead / PM / ICD / CRT / General / coaxial / lead / threshold / capture"},{"term":"導体","en":"conductor","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード内で電流を伝える芯線。断線するとインピーダンスが上昇し、出力不全や雑音の原因になる。複数の線を撚った構造は屈曲による疲労に強い。","tags":"Lead / PM / ICD / CRT / General / conductor / threshold / capture"},{"term":"2腔ペーシング","en":"dual chamber pacing","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"心房と心室の2腔をセンシング 側枝、下壁に中心静脈(MCV/PIV)。","tags":"CS GCV AIV MCV SCV 冠静脈 解剖 冠静脈洞 CS coronary sinus GCV MCV SCV AIV 側壁静脈 後側壁静脈"},{"term":"Marshall静脈（VOM）","en":"Vein of Marshall","abbr":"VOM","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左房後外側に走る冠静脈の枝。心房不整脈アブレーションの標的にもなる。","tags":"VOM Marshall 冠静脈 アブレーション"},{"term":"Wilson中心電極","en":"Wilson Central Terminal","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"単極胸部誘導の基準（不関電極）。四肢電極を抵抗で結んだ電気的中心。","tags":"Wilson 中心電極 単極 誘導"},{"term":"心電図記録紙（較正）","en":"ECG Paper / Calibration","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"標準は紙送り25mm/秒・較正10mm/mV。横1mm=0.04秒(40ms)、縦10mm=1mV。","tags":"記録紙 25mm 較正 10mm/mV"},{"term":"UTR","en":"Upper Tracking Rate","abbr":"UTR","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己P波に追従して心室ペーシングする上限。MTRと同義（メーカーで呼称が異なる）。超えるとウェンケバッハ/2:1応答。","tags":"UTR MTR 上限追従 tracking"},{"term":"USR","en":"Upper Sensor Rate","abbr":"USR","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答センサで到達できる上限レート（Upper Sensor Rate）。MSRと同義で、運動時にセンサが指示できる最大の心拍数を決める。P波追従の上限であるUTRとは別に設定する。","tags":"USR MSR センサ上限 sensor"},{"term":"2:1ブロックレート","en":"2:1 Block Rate","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"これ以上の心房レートで心室追従が2:1になる境界。約60000÷TARP(ms) bpm。","tags":"2:1 block TARP 上限"},{"term":"上限レートウェンケバッハ","en":"Upper Rate Wenckebach","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"上限追従レート付近でAVディレイが徐々に延び、時折心室追従が1拍抜ける挙動。","tags":"wenckebach 上限 追従 Wenckebach作動 wenckebach"},{"term":"センサ指示レート","en":"Sensor-Indicated Rate","abbr":"SIR","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"センサが算出した『今出すべきレート』。実際のペーシングレートの目安。","tags":"SIR sensor indicated rate"},{"term":"睡眠時レート","en":"Sleep / Rest Rate","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"就寝帯に下限レートを下げる設定（Sleep Rate/Rest Rate）。","tags":"sleep rest rate 睡眠 夜間"},{"term":"ADLレート","en":"ADL Rate","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、日常生活動作（歩行など中等度の活動）に対応して到達する目安のレート。運動時のより高いレートとは別に、普段の活動域を快適にするための設定点。","tags":"ADL rate 活動 レート応答"},{"term":"レートヒステリシス","en":"Rate Hysteresis","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己心拍が出たら次の刺激までのレートを設定より下げ、自己脈を優先する。","tags":"hysteresis ヒステリシス レート"},{"term":"サーチヒステリシス","en":"Search Hysteresis","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"一定間隔ごとに一時的にレートを下げ、自己脈が出るか探索する機能。自己伝導が回復していれば不要なペーシングを減らせる。ヒステリシスを自動で行う発展型。","tags":"search hysteresis サーチ"},{"term":"レート応答性AVディレイ","en":"Rate-Adaptive AV Delay","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レートが上がるとAVディレイを自動短縮し、生理的な房室伝導に近づける。","tags":"rate adaptive AV dynamic AV 動的AV"},{"term":"センス補正（SAVオフセット）","en":"Sense Compensation","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己P波感知の遅れを見込み、SAVをPAVより短く設定する差分。","tags":"sense compensation SAV offset"},{"term":"PVAB","en":"Post-Ventricular Atrial Blanking","abbr":"PVAB","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベント直後に心房で全く感知しない期間。ファーフィールドR波の誤検出を防ぐ。","tags":"PVAB ブランキング far-field"},{"term":"VRP","en":"Ventricular Refractory Period","abbr":"VRP","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"心室イベント後、心室感知を計時に反映しない期間。T波やPVCの誤検出を抑える。","tags":"VRP 心室不応期 refractory"},{"term":"ARP","en":"Atrial Refractory Period","abbr":"ARP","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"心房イベント後に設けられる心房の不応期。この間の心房シグナルは計時に反映しない。遠隔R波やペーシング後の残存電位を誤感知しないための保護期間で、PVARPもこの一部にあたる。","tags":"ARP 心房不応期 refractory"},{"term":"動的PVARP","en":"Dynamic / Auto PVARP","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"レートに応じてPVARPを自動で伸縮させる設定。高レートで短縮し追従性を保つ。","tags":"dynamic auto PVARP 動的"},{"term":"心室ブランキング（心房刺激後）","en":"Post-Atrial Ventricular Blanking","abbr":"PAVB","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房刺激直後に心室で感知しない短い窓。クロストーク（心房スパイクの心室誤感知）を防ぐ。","tags":"PAVB crosstalk クロストーク ブランキング"},{"term":"ノイズリバージョン","en":"Noise Reversion","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"連続雑音を感知すると一時的に非同期ペーシングへ切替え、過抑制を防ぐ。","tags":"noise reversion 雑音 非同期"},{"term":"レスポンスファクター（スロープ）","en":"Response Factor / Slope","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"活動量に対してどれだけレートを上げるかの傾きの設定。値を大きくすると軽い活動でもレートが上がりやすくなる。センサ感度全体を左右する基本パラメータ。","tags":"response factor slope スロープ 傾き"},{"term":"リアクションタイム","en":"Reaction Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動が始まってからレートが上がり始めるまでの速さの設定。短くすると立ち上がりが機敏になり、長くすると緩やかになる。患者の活動様式に合わせて調整する。","tags":"reaction time 立ち上がり"},{"term":"リカバリータイム","en":"Recovery Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動終了後にレートが下限へ戻るまでの速さの設定。短いと急に戻り、長いと余韻を持って下がる。運動直後の息切れ感などを見て調整する。","tags":"recovery time 回復"},{"term":"活動閾値","en":"Activity Threshold","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答センサが「活動あり」と判定し始める体動レベルのしきい値。低くすると軽い動きにも反応し、高くすると安静時の誤ったレート上昇を抑えられる。","tags":"activity threshold 活動閾値"},{"term":"NCAP","en":"Non-Competitive Atrial Pacing","abbr":"NCAP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房不応期内の自己P波の直後は、少し遅らせて心房刺激し競合を避ける機能。","tags":"NCAP 非競合 心房"},{"term":"PVC反応（PVARP延長）","en":"PVC Response","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室期外収縮を検出するとPVARPを一時延長し、PMTの誘発を防ぐ。","tags":"PVC response PVARP延長 PMT"},{"term":"PMT対応","en":"PMT Intervention","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"PMTを検出するとPVARP延長や1拍休止で連鎖を断つ機能。","tags":"PMT intervention 起因性頻拍"},{"term":"心室レート調整（VRR）","en":"Ventricular Rate Regulation","abbr":"VRR","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房細動時に心室ペーシングで心室レートの変動を滑らかにする（Conducted AF Response）。","tags":"VRR conducted AF 心室レート"},{"term":"レートドロップ反応","en":"Rate Drop Response","abbr":"RDR","cat":"不整脈・EP","device":"PM","maker":"General","short":"急な徐脈（血管迷走神経性失神など）を検出し、一定時間高めのレートで刺激する。","tags":"rate drop response 迷走神経 失神"},{"term":"心房オーバードライブ","en":"Atrial Preference Pacing","abbr":"APP","cat":"ペーシング","device":"PM","maker":"General","short":"自己P波よりわずかに速く心房刺激し、心房性不整脈の発生を抑える。","tags":"APP overdrive 心房 抑制"},{"term":"検出レート／間隔","en":"Detection Rate / Interval","abbr":"TDI","cat":"ICD","device":"ICD","maker":"General","short":"頻拍と判定するレート（間隔）のしきい値。ゾーンごとに設定する。","tags":"detection rate interval TDI ゾーン"},{"term":"検出時間（Duration）","en":"Detection Duration","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"治療前に頻拍が続くべき時間。長めにすると不適切作動・不要治療が減る。","tags":"duration 検出時間 NID"},{"term":"ATPバースト","en":"ATP Burst","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"一定間隔の連続刺激でVTを停止するATP。回数・連結期・刺激数を設定。","tags":"ATP burst バースト"},{"term":"ATPランプ","en":"ATP Ramp","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"刺激間隔を1拍ごとに短縮していく抗頻拍ペーシング。頻拍周期に食い込みながら停止を狙う方式で、バーストと並ぶ代表的なATP。","tags":"ATP ramp ランプ"},{"term":"連結期（カップリング）","en":"Coupling Interval","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ATPの最初の刺激を、頻拍周期に対して何%のタイミングで出すかの設定。短くすると頻拍を捕捉しやすいが加速のリスクもあり、停止率と安全性のバランスで決める。","tags":"coupling interval 連結期 ATP"},{"term":"ショックエネルギー","en":"Shock Energy","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが放電する電気ショックの出力（J）。初回・2回目以降・最大などを設定し、除細動閾値に十分な安全域をとる。高いほど確実だが充電時間と電池消耗が増える。","tags":"shock energy J 除細動 出力"},{"term":"コミッテッド／ノンコミッテッド","en":"Committed / Non-committed Shock","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"充電後に再確認せず放電するか（committed）、再確認して不要なら中止するか。","tags":"committed noncommitted shock 再確認"},{"term":"SVTリミット","en":"SVT Limit","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"SVT鑑別を適用する上限レート。これを超えると鑑別せず治療する。","tags":"SVT limit 鑑別 上限"},{"term":"VVディレイ","en":"VV Delay","abbr":"VV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"両室ペーシングで右室と左室を刺激する時間差の設定。0〜数十msの範囲で、心エコーやデバイスの最適化アルゴリズムを用いて、左室の同期が最良となる値に調整する。","tags":"VV delay interval 両室 VV delay VVペースディレイ SyncAV LVオフセット"},{"term":"LVペーシング極性","en":"LV Pacing Polarity","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室刺激に使う電極の組合せ設定。横隔神経刺激やアノーダル刺激の回避に変更する。","tags":"LV polarity 極性 横隔神経 アノーダル"},{"term":"LV-only／BiV設定","en":"LV-only vs BiV Pacing","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室単独か両室同時かのペーシング設定。AdaptivCRT等で自動切替も。","tags":"LV-only BiV fusion 融合"},{"term":"挿入型心電計（ICM）","en":"Insertable Cardiac Monitor","abbr":"ICM","cat":"不整脈・EP","device":"ICM","maker":"General","short":"皮下に挿入する小型の長期心電図記録計。動悸・失神の原因検索、潜因性脳梗塞の原因精査、発作性心房細動の検出に用いる。最長数年間の連続モニタリングが可能で、不整脈を自動検出するほか、症状時に患者自身が記録できる。","tags":"挿入型心電計（ICM） ICM ICM 挿入型心電計 ループレコーダー"},{"term":"Reveal LINQ / LINQ II","en":"Reveal LINQ II","abbr":"LINQ","cat":"不整脈・EP","device":"ICM","maker":"Medtronic","short":"メドトロニックの挿入型心電計。専用の挿入ツールで低侵襲に留置し、遠隔モニタリング（CareLink）で検出イベントを自動送信する。国内で広く用いられる代表的なICMで、小型・長寿命が特徴。","tags":"Reveal LINQ / LINQ II LINQ ICM 挿入型心電計 ループレコーダー"},{"term":"Confirm Rx / Assert-IQ","en":"Confirm Rx / Assert-IQ","abbr":"","cat":"不整脈・EP","device":"ICM","maker":"Abbott","short":"アボットの挿入型心電計。スマートフォンアプリと連携し、症状の記録やデータ送信を患者側から行えるのが特徴。国内で使用可能で、遠隔フォローに対応する。","tags":"Confirm Rx / Assert-IQ  ICM 挿入型心電計 ループレコーダー"},{"term":"BIOMONITOR","en":"BIOMONITOR","abbr":"","cat":"不整脈・EP","device":"ICM","maker":"BIOTRONIK","short":"バイオトロニックの挿入型心電計。Home Monitoringによる毎日の自動遠隔送信に対応し、大きく明瞭なR波感知を特徴とする。国内で使用可能。","tags":"BIOMONITOR  ICM 挿入型心電計 ループレコーダー"},{"term":"シングルコイル","en":"Single-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端に除細動コイルを1つ持つICDリード。構造が単純で慢性期の抜去が比較的容易。SVCコイルがない分、除細動閾値がやや高くなる場合があるが、現在は多くの症例で十分な有効性が得られる。","tags":"シングルコイル  Single-coil lead"},{"term":"デュアルコイル","en":"Dual-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端とSVC（上大静脈）位置に除細動コイルを2つ持つICDリード。除細動閾値を下げやすい一方、慢性期は癒着でリード抜去がやや難しくなることがある。","tags":"デュアルコイル  Dual-coil lead"},{"term":"高除細動閾値","en":"High DFT","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"確実な除細動に必要なエネルギーが高い状態。コイル位置の調整、SVCコイルのON/OFF、ショック極性の変更、皮下アレイの追加などで対応する。","tags":"高除細動閾値  High DFT 高DFT high DFT"},{"term":"受攻性上限試験","en":"Upper Limit of Vulnerability","abbr":"ULV","cat":"ICD","device":"ICD","maker":"General","short":"T波頂上付近に段階的な刺激を与え、心室細動を誘発しない最小エネルギーを求める検査。細動を誘発せずに除細動の安全域を推定できる方法。","tags":"受攻性上限試験 ULV Upper Limit of Vulnerability"},{"term":"ショックリダクション","en":"Shock reduction","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"不要・不適切なショックを減らす設定やアルゴリズムの総称。検出遅延の延長、高レートカットオフ、SVT鑑別、T波オーバーセンシング対策などを組み合わせる。","tags":"ショックリダクション  Shock reduction"},{"term":"ミニマムインターバル","en":"Minimum interval","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが心拍として計数する最短の間隔。これより短い信号は雑音などとして扱い、二重計数や過剰検出を避ける。","tags":"ミニマムインターバル  Minimum interval"},{"term":"心室細動","en":"Ventricular fibrillation","abbr":"VF","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室が無秩序に興奮し有効な拍出が失われる致死的不整脈。ICDの主要な治療対象で、検出後に高エネルギーショックで停止させる。","tags":"心室細動 VF Ventricular fibrillation reversible 可逆的要因 虚血 電解質"},{"term":"心室頻拍","en":"Ventricular tachycardia","abbr":"VT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室起源の頻拍。レートや血行動態に応じてATPやショックで治療する。持続性・非持続性、単形性・多形性に分けられる。","tags":"心室頻拍 VT Ventricular tachycardia monomorphic polymorphic sustained non-sustained 単形性 多形性 持続性 非持続性 右脚ブロック型 左脚ブロック型"},{"term":"非持続性心室頻拍","en":"Non-sustained VT","abbr":"NSVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"3連発以上で30秒未満に自然停止する心室頻拍。ICDでは治療されず記録され、リスク評価やフォローの材料になる。","tags":"非持続性心室頻拍 NSVT Non-sustained VT"},{"term":"トルサード・ド・ポアント","en":"Torsade de pointes","abbr":"TdP","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長を背景に生じる多形性心室頻拍。基線を軸にねじれる波形が特徴で、失神や心室細動へ移行しうる。","tags":"トルサード・ド・ポアント TdP Torsade de pointes TdP 多形性心室頻拍 polymorphic VT QT依存"},{"term":"定電圧方式","en":"Constant voltage output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電圧を保って刺激する出力方式。現在のペースメーカの標準で、リードインピーダンスに応じて流れる電流が変化する。","tags":"定電圧方式  Constant voltage output"},{"term":"定電流方式","en":"Constant current output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電流を保って刺激する出力方式。インピーダンスが変化しても電流が一定になる。旧来の一部機種で用いられた。","tags":"定電流方式  Constant current output"},{"term":"ステップダウン試験","en":"Step-down threshold test","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"出力を段階的に下げていき、捕捉が消える点を探して刺激閾値を求める測定法。","tags":"ステップダウン試験  Step-down threshold test"},{"term":"セーフティマージン試験","en":"Safety margin test","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定出力が刺激閾値に対して十分な余裕を持つか確認する試験。通常は閾値の約2倍を目安に安全域をとる。","tags":"セーフティマージン試験  Safety margin test"},{"term":"閾値測定（電圧・パルス幅）","en":"Threshold measurement","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"電圧を下げる、またはパルス幅を短くして捕捉が消える点を求める測定。強さ-時間曲線の考え方に基づく。","tags":"閾値測定（電圧・パルス幅）  Threshold measurement"},{"term":"スルーレート","en":"Slew rate","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"感知波形の立ち上がりの鋭さ（電位の変化速度）。大きいほど鋭く、良好な感知の指標。低いと感知不全の一因になる。","tags":"スルーレート  Slew rate"},{"term":"信号雑音比","en":"Signal-to-noise ratio","abbr":"S/N","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"感知したい心内電位と雑音の比。高いほど自己波を確実に感知でき、オーバーセンシングを避けやすい。","tags":"信号雑音比 S/N Signal-to-noise ratio"},{"term":"単極・双極電位記録法","en":"Unipolar/Bipolar electrogram","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"心内電位を記録する電極構成。双極は近接2電極間で遠隔雑音に強く、単極は缶を対極に用いて広い範囲の電位を捉える。","tags":"単極・双極電位記録法  Unipolar/Bipolar electrogram ユニポーラ バイポーラ unipolar bipolar"},{"term":"相対不応期","en":"Relative refractory period","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"強い刺激なら興奮を起こせるが、伝導や興奮が遅れる期間。絶対不応期に続く回復途上の時期。","tags":"相対不応期  Relative refractory period RRP"},{"term":"有効不応期","en":"Effective refractory period","abbr":"ERP","cat":"不整脈・EP","device":"","maker":"General","short":"期外刺激を与えても伝導がその先へ進まない、最も長い連結期。伝導系の性質を評価する電気生理指標。","tags":"有効不応期 ERP Effective refractory period"},{"term":"機能的不応期","en":"Functional refractory period","abbr":"FRP","cat":"不整脈・EP","device":"","maker":"General","short":"ある部位を通過して出てくる興奮の最短間隔。その部位の伝導能を表す電気生理指標。","tags":"機能的不応期 FRP Functional refractory period"},{"term":"補充調律","en":"Escape rhythm","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"上位のペースメーカが止まったとき、下位（房室接合部や心室）が肩代わりして出す調律。徐脈時の生命維持に働く。","tags":"補充調律  Escape rhythm 接合部補充調律 心室補充調律 junction"},{"term":"リエントリー","en":"Reentry","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"興奮が旋回して持続する不整脈の主要機序。瘢痕や副伝導路を旋回路とし、多くのVT・SVTの原因になる。","tags":"リエントリー  Reentry reentry 一方向性ブロック 緩徐伝導"},{"term":"心房細動","en":"Atrial fibrillation","abbr":"AF","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房が無秩序に興奮し、心室応答が不規則になる不整脈。デバイスではモードスイッチや心房頻拍記録の対象で、抗凝固の判断にも関わる。","tags":"心房細動 AF Atrial fibrillation paroxysmal persistent permanent 発作性 持続性 永続性"},{"term":"心房粗動","en":"Atrial flutter","abbr":"AFL","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房内の旋回興奮による規則的な頻拍。1:1伝導では速い心室応答となり、デバイスの心房追従にも影響する。","tags":"心房粗動 AFL Atrial flutter AFL 通常型 非通常型 Wells Wells 反時計回転 時計回転 鋸歯状"},{"term":"心房頻拍","en":"Atrial tachycardia","abbr":"AT","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の規則的な頻拍。デバイスはこれを検出してモードスイッチや心房ATPで対応する。","tags":"心房頻拍 AT Atrial tachycardia AT focal マクロリエントリー AT isoelectric line 等電位線 特発性 続発性"},{"term":"上室頻拍","en":"Supraventricular tachycardia","abbr":"SVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心房・房室接合部起源の頻拍の総称。ICDではVTとの鑑別が重要で、鑑別を誤ると不適切作動の原因になる。","tags":"上室頻拍 SVT Supraventricular tachycardia SVT"},{"term":"上室期外収縮","en":"Premature atrial contraction","abbr":"PAC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の早期収縮。頻発すると心房頻拍・心房細動の引き金になりうる。","tags":"上室期外収縮 PAC Premature atrial contraction APC PAC APC 心房期外収縮 atrial premature contraction"},{"term":"心室期外収縮","en":"Premature ventricular contraction","abbr":"PVC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心室起源の早期収縮。デバイスはこれを感知してPVARP延長などで対応し、PMTの予防にも関わる。","tags":"心室期外収縮 PVC Premature ventricular contraction VPC PVC 期外収縮 特発性 器質的 scar 瘢痕 多源性"},{"term":"ディスシンクロニー","en":"Dyssynchrony","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"心室内・心室間の収縮タイミングのずれ。左脚ブロックなどで生じ、CRTの適応と効果判定の中心概念。","tags":"ディスシンクロニー  Dyssynchrony 心室同期不全 dyssynchrony"},{"term":"心室内伝導障害","en":"Intraventricular conduction disturbance","abbr":"IVCD","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"脚や末梢の伝導障害でQRSが幅広くなる状態。左脚ブロック型はCRTの良い適応となりうる。","tags":"心室内伝導障害 IVCD Intraventricular conduction disturbance"},{"term":"脚ブロック","en":"Bundle branch block","abbr":"BBB","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"右脚または左脚の伝導障害。左脚ブロックは心室同期障害を来し、CRTの効果が期待できる。","tags":"脚ブロック BBB Bundle branch block"},{"term":"高度房室ブロック","en":"Advanced AV block","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"連続する複数のP波が心室へ伝わらない重い房室ブロック。症候性なら恒久ペーシングの適応となる。","tags":"高度房室ブロック  Advanced AV block"},{"term":"洞房ブロック","en":"Sinoatrial block","abbr":"SA block","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節の興奮が心房へ伝わらず、心房興奮が欠落する状態。洞不全症候群の一型。","tags":"洞房ブロック SA block Sinoatrial block"},{"term":"洞性徐脈","en":"Sinus bradycardia","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節由来で心拍が遅い状態。症候性であれば恒久ペーシングの適応になりうる。","tags":"洞性徐脈  Sinus bradycardia"},{"term":"血管迷走神経性失神","en":"Vasovagal syncope","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"迷走神経反射による一過性の徐脈・血圧低下で起こる失神。心停止型ではレートドロップ反応などのペーシングが検討される。","tags":"血管迷走神経性失神  Vasovagal syncope vasovagal tilt"},{"term":"頸動脈洞症候群","en":"Carotid sinus syndrome","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"頸動脈洞への刺激で強い徐脈・血圧低下を来す病態。心抑制型はペーシングの適応になりうる。","tags":"頸動脈洞症候群  Carotid sinus syndrome carotid sinus 過敏性頸動脈洞"},{"term":"QT延長症候群","en":"Long QT syndrome","abbr":"LQTS","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長によりTdPや突然死のリスクが高まる病態。二次予防や高リスク例でICDが考慮される。","tags":"QT延長症候群 LQTS Long QT syndrome LQTS Romano-Ward Jervell-Lange-Nielsen LQT1 LQT2 LQT3 LQT1 LQT2 LQT3 KCNQ1 KCNH2 SCN5A メキシレチン ナドロール"},{"term":"ブルガダ症候群","en":"Brugada syndrome","abbr":"","cat":"不整脈・EP","device":"ICD","maker":"General","short":"右側胸部誘導の特徴的ST上昇を示し、心室細動・突然死を来しうる遺伝性不整脈。適応例でICDが用いられる。","tags":"ブルガダ症候群  Brugada syndrome Brugada coved saddleback SCN5A coved saddle back type1 type2 ピルジカイニド ボックリ病"},{"term":"カテコラミン誘発性多形性心室頻拍","en":"CPVT","abbr":"CPVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"運動や情動で多形性VTを生じる遺伝性不整脈。薬物治療を基本とし、高リスク例でICDを併用する。","tags":"カテコラミン誘発性多形性心室頻拍 CPVT CPVT"},{"term":"肥大型心筋症","en":"Hypertrophic cardiomyopathy","abbr":"HCM","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心筋の異常肥大を来す疾患。突然死リスク評価に基づき、一次・二次予防でICDが考慮される。","tags":"肥大型心筋症 HCM Hypertrophic cardiomyopathy HCM HOCM 非閉塞性 サルコメア ASH"},{"term":"拡張型心筋症","en":"Dilated cardiomyopathy","abbr":"DCM","cat":"不整脈・EP","device":"CRT","maker":"General","short":"心室拡大と収縮低下を来す疾患。低心機能・伝導遅延例ではCRTやICDの適応になる。","tags":"拡張型心筋症 DCM Dilated cardiomyopathy"},{"term":"心筋梗塞","en":"Myocardial infarction","abbr":"MI","cat":"不整脈・EP","device":"ICD","maker":"General","short":"冠動脈閉塞による心筋壊死。梗塞後の低心機能はICD適応の代表的背景で、瘢痕はVTの基質になる。","tags":"心筋梗塞 MI Myocardial infarction"},{"term":"心臓突然死","en":"Sudden cardiac death","abbr":"SCD","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心原性の予期せぬ急死。多くは致死性心室性不整脈が原因で、ICDによる一次・二次予防の対象。","tags":"心臓突然死 SCD Sudden cardiac death"},{"term":"リバースリモデリング","en":"Reverse remodeling","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"CRTが奏効し、左室容積の縮小と収縮機能の改善が得られる現象。効果判定の重要な指標。","tags":"リバースリモデリング  Reverse remodeling"},{"term":"反復性非リエントリー性室房同期","en":"RNRVAS","abbr":"RNRVAS","cat":"CRT・CSP","device":"CRT","maker":"General","short":"逆行性室房伝導により心房が持続的に不応期に入り、心房追従が失われて有効な同期が保てなくなる現象。設定調整で対処する。","tags":"反復性非リエントリー性室房同期 RNRVAS RNRVAS"},{"term":"デバイス感染","en":"CIED infection","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体やリードに及ぶ感染。ポケット感染から菌血症・感染性心内膜炎に至ると、全システムの抜去が原則となる。","tags":"デバイス感染  CIED infection"},{"term":"ポケット感染","en":"Pocket infection","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体を収めるポケットの感染。発赤・腫脹・排膿を呈し、抗菌薬のみでの治癒は難しく、デバイス抜去を要することが多い。","tags":"ポケット感染  Pocket infection"},{"term":"心タンポナーデ","en":"Cardiac tamponade","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"心嚢内への出血・液貯留で心臓が圧迫され拍出が低下する状態。リード穿孔の重篤な合併症で緊急対応を要する。","tags":"心タンポナーデ  Cardiac tamponade"},{"term":"三尖弁（デバイス関連）","en":"Tricuspid valve / lead-related TR","abbr":"","cat":"リード","device":"ICD","maker":"General","short":"右室リードが三尖弁を通過するため、弁の可動制限や逆流（TR）を来すことがある。リード位置や本数に配慮する。","tags":"三尖弁（デバイス関連）  Tricuspid valve / lead-related TR"},{"term":"Twiddler症候群","en":"Twiddler's syndrome","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"患者が本体をポケット内で回してしまい、リードが巻きついて脱転位・断線する現象。ペーシング不全や横隔膜刺激の原因になる。","tags":"Twiddler症候群  Twiddler's syndrome"},{"term":"皮膚圧迫壊死","en":"Skin erosion","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体やリードが皮膚を圧迫し、菲薄化・露出（びらん）を来す状態。感染に準じて扱い、被覆・移設や抜去を要することが多い。","tags":"皮膚圧迫壊死  Skin erosion"},{"term":"リード抜去","en":"Lead extraction","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"感染・断線・不要リードなどを体内から抜き取る手技。癒着が強い慢性期はレーザーシースなどの専用器具を用いる。","tags":"リード抜去  Lead extraction"},{"term":"レーザー抜去（レーザーシース）","en":"Laser lead extraction","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"レーザーで癒着組織を切離しながらリードを抜去する方法。慢性期の強固な癒着例で用いられる。","tags":"レーザー抜去（レーザーシース）  Laser lead extraction"},{"term":"抜去用シース（メカニカル/回転式）","en":"Mechanical/rotational sheath","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"機械的に癒着を剥離してリードを抜去するシース。回転刃を備えるタイプもある。","tags":"抜去用シース（メカニカル/回転式）  Mechanical/rotational sheath"},{"term":"ロッキングスタイレット","en":"Locking stylet","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード内腔で固定し、抜去時の牽引力を先端まで伝える器具。リードの伸びや断裂を防ぐ。","tags":"ロッキングスタイレット  Locking stylet"},{"term":"コネクタ接続不良（ルーズピン）","en":"Connector issue (loose pin)","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"本体とリードの接続が不完全な状態。ピンの締め込み不足などで生じ、出力不全・雑音・感知不全の原因になる。","tags":"コネクタ接続不良（ルーズピン）  Connector issue (loose pin)"},{"term":"デバイスリセット","en":"Device reset","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"強い電磁干渉などで設定が初期値へ戻る現象（パワーオンリセット）。予期せぬモード・レートになりうるため点検で確認する。","tags":"デバイスリセット  Device reset"},{"term":"フィードスルー","en":"Feedthrough","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"気密封止を保ったまま電気信号を本体の内外へ通す構造部品。信頼性の要となる。","tags":"フィードスルー  Feedthrough"},{"term":"非侵襲的経皮ペーシング","en":"Transcutaneous pacing","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"胸壁のパッドから体外式に心臓を刺激する緊急ペーシング。恒久植込みまでのつなぎに用いる。","tags":"非侵襲的経皮ペーシング  Transcutaneous pacing"},{"term":"一時的心外膜ペーシングワイヤ","en":"Temporary epicardial wire","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"心臓手術時に心外膜へ縫着する一時ペーシング用の細い電線。術後の徐脈に備える。","tags":"一時的心外膜ペーシングワイヤ  Temporary epicardial wire ハートワイヤー heart wire"},{"term":"植込み時アクセス合併症","en":"Access complications","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"静脈穿刺に伴う気胸・血胸・血腫・動脈穿刺・空気塞栓などの合併症。穿刺法の工夫で予防する。","tags":"植込み時アクセス合併症  Access complications"},{"term":"皮下血腫","en":"Pocket hematoma","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"ポケット内の出血・血腫。抗凝固・抗血小板薬使用時に増える。感染リスクを高めるため管理が重要。","tags":"皮下血腫  Pocket hematoma"},{"term":"電子商品監視システム（EAS）","en":"Electronic article surveillance","abbr":"EAS","cat":"MRI・EMI","device":"PM / ICD / CRT","maker":"General","short":"店舗の盗難防止ゲートなどの電磁場発生源。まれにデバイスへ干渉するため、立ち止まらず通過するよう指導する。","tags":"電子商品監視システム（EAS） EAS Electronic article surv ized cardioversion cardioversion CV 同期"},{"term":"ポストショックペーシング","en":"Post-shock pacing","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ショック後の一時的な徐脈に備え、一定時間バックアップとして行うペーシング。","tags":"ポストショックペーシング  Post-shock pacing post-shock backup"},{"term":"検出ゾーン","en":"Detection zones (VF/VT/FVT)","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"頻拍を心拍数で区切った検出帯。VFゾーン・VTゾーン・Fast VT(FVT)ゾーン・モニタゾーンなどを設定する。","tags":"検出ゾーン  Detection zones (VF/VT/FVT) VF zone VT zone FVT monitor 検出ゾーン設定"},{"term":"Fast VTゾーン","en":"Fast VT zone","abbr":"FVT","cat":"ICD","device":"ICD","maker":"General","short":"VTゾーンとVFゾーンの間に置く高レートVTの帯。ATPで無痛停止を狙える速いVTを別に扱う。","tags":"Fast VTゾーン FVT Fast VT zone FVT fast VT"},{"term":"累積カウント方式","en":"Consecutive interval counting","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"連続して設定拍数を満たすと頻拍と判定する方式。1拍でも基準を外れるとカウントが0に戻る。VT検出に用いる。","tags":"累積カウント方式  Consecutive interval counting consecutive count 累積検出"},{"term":"X/Y検出（ウインドウセンシング）","en":"X-of-Y detection","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"直近Y拍のうちX拍が検出帯に入れば頻拍と判定する方式。間欠的アンダーセンシングがあっても検出を継続できる。VF検出に用いる。","tags":"X/Y検出（ウインドウセンシング）  X-of-Y detection X/Y window sensing ウインドウ"},{"term":"頻拍周期","en":"Cycle Length","abbr":"CL","cat":"ICD","device":"ICD","maker":"General","short":"頻拍時のR-R間隔（周期）。検出やATPの設定基準になる。","tags":"頻拍周期 CL Cycle Length cycle length CL R-R"},{"term":"onset基準","en":"Onset criterion","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"心拍数の立ち上がりの急峻さでSVTとVTを鑑別するSVT鑑別基準。ゆるやかな上昇の洞頻拍を除外する。","tags":"onset基準  Onset criterion onset SVT鑑別"},{"term":"stability基準","en":"Stability criterion","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"R-R間隔の変動の大きさでSVTとVTを鑑別する基準。不安定なら心房細動、安定ならVTと判定する。","tags":"stability基準  Stability criterion stability SVT鑑別"},{"term":"QRS波形識別","en":"Morphology discrimination","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"頻拍時のQRS波形を洞調律のテンプレートと比較して鑑別する方法。一致率が高ければSVTとして治療を保留する。","tags"   const ord=G_CAT_ORDER.filter(c=>cats.includes(c));cats.forEach(c=>{if(!ord.includes(c))ord.push(c)});
  const counts={};ord.forEach(c=>counts[c]=all.filter(t=>t.cat===c).length);
  let h=chip("すべて",gCat==="すべて",all.length);ord.forEach(c=>h+=chip(c,gCat===c,counts[c]));
  $("#chips").innerHTML=h;[...$("#chips").querySelectorAll(".chip")].forEach(b=>b.onclick=()=>{gCat=b.dataset.v;renderChips();renderList()});
  let d=chip("すべて",gDev==="すべて",all.length,"dev");
  DEV_TOKENS.forEach(tk=>{const n=all.filter(t=>(t.device||"").split(/[\/,]/).map(x=>x.trim()).includes(tk)).length;d+=chip(tk,gDev===tk,n,"dev")});
  $("#devchips").innerHTML=d;[...$("#devchips").querySelectorAll(".chip")].forEach(b=>b.onclick=()=>{gDev=b.dataset.v;renderChips();renderList()});
 }else{
  const all=fList(),cats=[...new Set(all.map(t=>t.cat))];
  const counts={};cats.forEach(c=>counts[c]=all.filter(t=>t.cat===c).length);
  let h=chip("すべて",fCat==="すべて",all.length);cats.forEach(c=>h+=chip(c,fCat===c,counts[c]));
  $("#fchips").innerHTML=h;[...$("#fchips").querySelectorAll(".chip")].forEach(b=>b.onclick=()=>{fCat=b.dataset.v;renderChips();renderList()});
  let mk=chip("すべて",fMk==="すべて",all.length,"dev");
  VENDORS.forEach(([k,lab])=>{const n=all.filter(t=>t[k]&&t[k]!=="—").length;mk+=chip(lab,fMk===lab,n,"dev")});
  $("#fmkchips").innerHTML=mk;[...$("#fmkchips").querySelectorAll(".chip")].forEach(b=>b.onclick=()=>{fMk=b.dataset.v;renderChips();renderList()});
 }
}
function renderList(){
 const q=query.trim().toLowerCase();
 if(view==="g"){
  let rows=applyMode("g",gList());
  rows=rows.filter(t=>{if(gCat!=="すべて"&&t.cat!==gCat)return false;if(gDev!=="すべて"&&!(t.device||"").split(/[\/,]/).map(x=>x.trim()).includes(gDev))return false;if(!q)return true;return [t.term,t.en,t.abbr,t.short,t.tags].some(f=>(f||"").toLowerCase().includes(q))});
  rows=sortRows("g",rows);
  totalsEl.textContent=gList().length+" terms";countEl.textContent=rows.length+" results";
  listEl.innerHTML=rows.length?rows.map(gcard).join(""):emptyHTML();
 }else{
  let rows=applyMode("f",fList());
  rows=rows.filter(t=>{if(fCat!=="すべて"&&t.cat!==fCat)return false;if(fMk!=="すべて"){const kv=VENDORS.find(v=>v[1]===fMk);if(kv&&!(t[kv[0]]&&t[kv[0]]!=="—"))return false;}if(!q)return true;return [t.fn,t.en,t.note,t.mdt,t.abt,t.bsx,t.bio,t.mcp].some(f=>(f||"").toLowerCase().includes(q))});
  rows=sortRows("f",rows);
  totalsEl.textContent=fList().length+" functions";countEl.textContent=rows.length+" results";
  listEl.innerHTML=rows.length?rows.map(fcard).join(""):emptyHTML();
 }
 [...listEl.querySelectorAll(".cardrow")].forEach(li=>li.addEventListener("click",()=>openDetail(li.dataset.id)));
 [...listEl.querySelectorAll("[data-edit]")].forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(b.dataset.edit)});
 [...listEl.querySelectorAll("[data-fav]")].forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav)});
}
function emptyHTML(){return `<li class="empty"><p class="big">該当がありません</p><p class="sm">別のキーワードやフィルターでお試しください。</p></li>`}
function badges(t){let s="";if(t._add)s+=sh.on?`<span class="tag" style="background:#dcfce7;color:#15803d">共有</span>`:`<span class="tag" style="background:#ecfeff;color:#0e7490">この端末</span>`;return s}
function gcard(t){
 const[bg,fg]=catColor(t.cat),meta=[];
 if(t.device)meta.push(`<span class="tag">${esc(t.device)}</span>`);
 if(t.maker&&t.maker!=="General")meta.push(`<span class="tag mk">${esc(t.maker)}</span>`);
 const b=badges(t);
 return `<li class="cardrow" data-key="g|${esc(t.term)}" data-id="${esc(t._id)}"><div class="cardhead">
  <p class="term">${esc(t.term)}${t.abbr?`<span class="abbr">${esc(t.abbr)}</span>`:""}</p>
  <div class="cardtools"><span class="pill" style="background:${bg};color:${fg}">${esc(t.cat)}</span>${starBtn("g|"+t.term)}${editBtn(t._id)}</div></div>
  ${t.en?`<p class="en">${esc(t.en)}</p>`:""}${(meta.length||b)?`<div class="metarow">${b}${meta.join("")}</div>`:""}
  ${t.short?`<p class="short">${esc(t.short)}</p>`:""}</li>`;
}
function fcard(t){
 const[bg,fg]=catColor(t.cat);
 const rows=VENDORS.map(([k,lab])=>{const val=t[k];const none=!val||val==="—";return `<div class="vrow"><span class="vlabel">${lab}</span><span class="vval${none?" none":""}">${none?"—":esc(val)}</span></div>`}).join("");
 const b=badges(t);
 return `<li class="cardrow" data-key="f|${esc(t.fn)}" data-id="${esc(t._id)}"><div class="cardhead">
  <p class="fn">${esc(t.fn)}</p>
  <div class="cardtools"><span class="pill" style="background:${bg};color:${fg}">${esc(t.cat)}</span>${starBtn("f|"+t.fn)}${editBtn(t._id)}</div></div>
  ${t.en?`<p class="en">${esc(t.en)}</p>`:""}${b?`<div class="metarow">${b}</div>`:""}
  <div class="vgrid">${rows}</div>
  ${t.note?`<p class="note">${esc(t.note)}</p>`:""}</li>`;
}
function editBtn(id){return `<button class="iconbtn" data-edit="${esc(id)}" aria-label="編集"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`}

function fTxt(id,label,ph,v,ta){const c=ta?`<textarea id="${id}" placeholder="${ph||''}">${esc(v||'')}</textarea>`:`<input id="${id}" type="text" placeholder="${ph||''}" value="${esc(v||'')}"/>`;return `<div class="field"><label for="${id}">${label}</label>${c}</div>`}
function fSel(id,label,opts,v){const o=opts.map(x=>`<option value="${esc(x)}"${x===(v||'')?' selected':''}>${esc(x)}</option>`).join('');return `<div class="field"><label for="${id}">${label}</label><select id="${id}" class="fsel">${o}</select></div>`}
function fChk(id,label,opts,sel){const s=new Set(sel||[]);const b=opts.map(x=>`<label class="chk"><input type="checkbox" name="${id}" value="${esc(x)}"${s.has(x)?' checked':''}/><span>${esc(x)}</span></label>`).join('');return `<div class="field"><label>${label}</label><div class="chkrow">${b}</div></div>`}
function getChecked(name){return [...document.querySelectorAll('input[name='+name+']:checked')].map(c=>c.value).join(" / ")}
function buildModalFields(cur){cur=cur||{};
 if(view==="g"){
  const cats=G_CAT_ORDER.slice();gList().forEach(x=>{if(x.cat&&!cats.includes(x.cat))cats.push(x.cat)});if(cur.cat&&!cats.includes(cur.cat))cats.unshift(cur.cat);
  const devSel=(cur.device||"").split(/[\/,]/).map(x=>x.trim()).filter(Boolean);
  const devOpts=DEV_TOKENS.slice();devSel.forEach(t=>{if(!devOpts.includes(t))devOpts.push(t)});
  const mk=MAKERS.slice();if(cur.maker&&!mk.includes(cur.maker))mk.unshift(cur.maker);
  modalFields.innerHTML=`<div class="row2">${fTxt("f_term","用語 *","例: PVARP",cur.term)}${fTxt("f_abbr","略語","例: PVARP",cur.abbr)}</div>`
   +fTxt("f_en","英語名","例: Post-Ventricular Atrial Refractory Period",cur.en)
   +`<div class="row2">${fSel("f_cat","カテゴリ *",cats,cur.cat||(gCat!=="すべて"?gCat:cats[0]))}${fSel("f_maker","メーカー",mk,cur.maker||"General")}</div>`
   +fChk("f_device","対象デバイス",devOpts,devSel)
   +fTxt("f_short","説明 *","例: 心室イベント後の心房不応期。逆行性P波の感知やPMTを防ぐ。",cur.short,true);
 }else{
  const cats=FEAT_CATS_BASE.slice();fList().forEach(x=>{if(x.cat&&!cats.includes(x.cat))cats.push(x.cat)});if(cur.cat&&!cats.includes(cur.cat))cats.unshift(cur.cat);
  modalFields.innerHTML=fTxt("f_fn","機能名 *","例: レートレスポンス（生理的センサ）",cur.fn)
   +`<div class="row2">${fTxt("f_en","英語/汎用名","例: Rate response sensor",cur.en)}${fSel("f_cat","カテゴリ *",cats,cur.cat||(fCat!=="すべて"?fCat:cats[0]))}</div>`
   +fTxt("f_mdt","メドトロニック","例: 加速度センサ",cur.mdt)+fTxt("f_abt","アボット","例: 加速度センサ",cur.abt)+fTxt("f_bsx","ボストン","例: Blended Sensor",cur.bsx)
   +fTxt("f_bio","バイオトロニック","例: CLS",cur.bio)+fTxt("f_mcp","マイクロポート","例: SonR",cur.mcp)
   +fTxt("f_note","メモ","例: 補足の説明（任意）",cur.note,true);
 }
}
function openModal(){$("#overlay").classList.add("open")}
function closeModal(){$("#overlay").classList.remove("open")}
function openAdd(){editingId=null;modalTitle.textContent=view==="g"?"用語を追加":"機能を追加";buildModalFields({});deleteBtn.style.display="none";openModal();setTimeout(()=>{const el=$("#f_term")||$("#f_fn");el&&el.focus()},50)}
function openEdit(id){const arr=view==="g"?gList():fList();const t=arr.find(x=>x._id===id);if(!t)return;editingId=id;modalTitle.textContent="編集";buildModalFields(t);deleteBtn.style.display="";openModal()}
function val(k){const el=$("#f_"+k);return el?el.value.trim():""}
function save(){
 if(view==="g"){
  const v={term:val("term"),abbr:val("abbr"),en:val("en"),cat:val("cat"),device:getChecked("f_device"),maker:val("maker"),short:val("short")};
  if(!v.term||!v.cat||!v.short){alert("用語・カテゴリ・説明 は必須です。");return}
  if(editingId&&editingId.slice(0,2)==="m:"){overlay.editG[editingId.slice(2)]=v}
  else if(editingId&&editingId.slice(0,2)==="a:"){const id=editingId.slice(2);const it=overlay.addG.find(x=>x.id===id);if(it)Object.assign(it,v)}
  else{v.id=uid();v.tags="";overlay.addG.push(v)}
 }else{
  const v={fn:val("fn"),en:val("en"),cat:val("cat"),mdt:val("mdt"),abt:val("abt"),bsx:val("bsx"),bio:val("bio"),mcp:val("mcp"),note:val("note")};
  if(!v.fn||!v.cat){alert("機能名・カテゴリ は必須です。");return}
  if(editingId&&editingId.slice(0,2)==="m:"){overlay.editF[editingId.slice(2)]=v}
  else if(editingId&&editingId.slice(0,2)==="a:"){const id=editingId.slice(2);const it=overlay.addF.find(x=>x.id===id);if(it)Object.assign(it,v)}
  else{v.id=uid();overlay.addF.push(v)}
 }
 persistOverlay();closeModal();renderChips();renderList()
}
function del(){if(!editingId)return;if(!confirm("削除しますか？（この端末の変更として保存されます）"))return;
 const k=editingId.slice(2),isM=editingId.slice(0,2)==="m:";
 if(view==="g"){if(isM){if(!overlay.delG.includes(k))overlay.delG.push(k);delete overlay.editG[k]}else{overlay.addG=overlay.addG.filter(x=>x.id!==k)}}
 else{if(isM){if(!overlay.delF.includes(k))overlay.delF.push(k);delete overlay.editF[k]}else{overlay.addF=overlay.addF.filter(x=>x.id!==k)}}
 persistOverlay();closeModal();renderChips();renderList()
}

function toast(msg,err){const t=$("#toast");if(!t)return;t.textContent=msg;t.style.background=err?"#be123c":"#0f766e";t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
function status(txt){const el=$("#syncStatus");if(el)el.textContent=txt||""}
async function loadMaster(manual){
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);const d=await r.json();
  if(Array.isArray(d.gloss))rawG=d.gloss;if(Array.isArray(d.feats))rawF=d.feats;
  store.set(MK,{gloss:rawG,feats:rawF});const now=new Date();store.set(TK,now.getTime());
  renderChips();renderList();status("☁︎ 最新版・"+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+"取得");if(manual)toast("最新版に更新しました");
 }catch(e){const t=store.get(TK);const d=t?new Date(t):null;status("オフライン："+(d?("最終 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+"の保存版を表示"):"保存版を表示"));if(manual)toast("更新できませんでした（オフライン）",true)}
}
function exportOverlay(){const b=new Blob([JSON.stringify(overlay,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="cieds-changes-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(u);dataMenu.removeAttribute("open")}
function importOverlay(file){const r=new FileReader();r.onload=()=>{try{overlay=normOv(JSON.parse(r.result));persistOverlay();renderChips();renderList();alert("変更を読み込みました。")}catch(e){alert("読み込めませんでした。書き出したJSONを選んでください。")}dataMenu.removeAttribute("open")};r.readAsText(file)}
function resetOverlay(){if(!confirm("この端末の変更（追加・編集・削除）をすべて取り消し、マスターの状態に戻します。共有オンの場合は他の端末にも反映されます。よろしいですか？"))return;overlay=normOv(null);persistOverlay();renderChips();renderList();dataMenu.removeAttribute("open")}

// ---- 端末間共有（変更を同期 / JSONBin） ----
function saveSh(){store.set(SH_KEY,sh)}
const SAPI="https://api.jsonbin.io/v3/b";
function shPayload(){overlay.ts=overlay.ts||Date.now();return overlay}
async function shCreate(){const r=await fetch(SAPI,{method:"POST",headers:{"Content-Type":"application/json","X-Master-Key":sh.key,"X-Bin-Private":"true","X-Bin-Name":"cieds-shared-changes"},body:JSON.stringify(shPayload())});if(!r.ok)throw new Error("create "+r.status);const j=await r.json();return j.metadata.id}
async function shGet(){const r=await fetch(SAPI+"/"+sh.binId+"/latest",{headers:{"X-Master-Key":sh.key}});if(!r.ok)throw new Error("get "+r.status);const j=await r.json();return j.record}
async function shPut(){const r=await fetch(SAPI+"/"+sh.binId,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":sh.key},body:JSON.stringify(shPayload())});if(!r.ok)throw new Error("put "+r.status)}
function shApply(d){overlay=normOv(d);store.set(OV,overlay);renderChips();renderList()}
let shT=null;
function pushSharedSoon(){if(!sh.on||!sh.binId)return;clearTimeout(shT);shT=setTimeout(()=>{shPut().then(()=>toast("共有に反映しました")).catch(()=>toast("共有エラー",true))},1200)}
async function pullShared(manual){if(!sh.on||!sh.binId)return;try{const d=await shGet();if(((d&&d.ts)||0)>=(overlay.ts||0)){shApply(d)}else{await shPut()}if(manual)toast("共有を同期しました")}catch(e){if(manual)toast("共有の同期に失敗",true)}}
function encCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({k:sh.key,b:sh.binId}))))}
function decCode(code){return JSON.parse(decodeURIComponent(escape(atob(code.trim()))))}
function openShare(){dataMenu.removeAttribute("open");$("#sh_key").value=sh.key||"";$("#sh_code").value="";updateShare();$("#shareOverlay").classList.add("open")}
function updateShare(){const on=sh.on&&sh.binId;$("#sh_state").textContent=on?"有効（この端末は共有中）":"未設定";$("#sh_codeout").value=on?encCode():"";$("#sh_codeoutWrap").style.display=on?"":"none";$("#sh_off").style.display=on?"":"none"}
async function shareStart(){const k=$("#sh_key").value.trim();if(!k){alert("APIキーを入力してください。");return}sh.key=k;sh.on=true;overlay.ts=Date.now();saveSh();const b=$("#sh_start");b.textContent="作成中…";try{const id=await shCreate();sh.binId=id;saveSh();updateShare();setView(view);toast("共有を開始しました");alert("共有を開始しました。\n\nもう1台では、下の「接続コード」をコピーして貼り付け、「参加」を押してください。")}catch(e){sh.on=false;saveSh();alert("作成できませんでした。APIキーを確認してください。")}b.textContent="この端末で共有を開始（1台目）"}
async function shareJoin(){const c=$("#sh_code").value.trim();if(!c){alert("接続コードを貼り付けてください。");return}let o;try{o=decCode(c)}catch(e){alert("接続コードが正しくありません。");return}sh.key=o.k;sh.binId=o.b;sh.on=true;saveSh();const b=$("#sh_join");b.textContent="参加中…";try{const d=await shGet();shApply(d);updateShare();setView(view);toast("共有に参加しました");alert("共有に参加しました。以後、変更が自動で同期されます。")}catch(e){sh.on=false;saveSh();alert("参加できませんでした。接続コードを確認してください。")}b.textContent="接続コードで参加（2台目以降）"}
function shareOff(){if(!confirm("この端末の共有を解除します。変更内容は端末に残ります。"))return;sh={key:"",binId:"",on:false,ts:overlay.ts||0};saveSh();updateShare();setView(view);toast("共有を解除しました")}

searchEl.addEventListener("input",e=>{query=e.target.value;clearEl.style.display=query?"block":"none";renderList();renderSuggest()});
searchEl.addEventListener("focus",()=>{if(query)renderSuggest()});
searchEl.addEventListener("blur",()=>setTimeout(hideSuggest,150));
clearEl.addEventListener("click",()=>{query="";searchEl.value="";clearEl.style.display="none";searchEl.focus();renderList();hideSuggest()});
$("#segG").addEventListener("click",()=>setView("g"));
$("#segF").addEventListener("click",()=>setView("f"));
$("#openAdd").addEventListener("click",openAdd);
$("#cancelBtn").addEventListener("click",closeModal);
$("#saveBtn").addEventListener("click",save);
deleteBtn.addEventListener("click",del);
$("#overlay").addEventListener("click",e=>{if(e.target===$("#overlay"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#overlay").classList.contains("open"))closeModal();if($("#detailOverlay").classList.contains("open"))closeDetail();if($("#shareOverlay").classList.contains("open"))$("#shareOverlay").classList.remove("open")}});
$("#refreshBtn").addEventListener("click",()=>{dataMenu.removeAttribute("open");loadMaster(true)});
$("#sortSel").addEventListener("change",e=>{if(view==="g")gSort=e.target.value;else fSort=e.target.value;renderList()});
$("#d_close").addEventListener("click",closeDetail);
$("#d_edit").addEventListener("click",()=>{closeDetail();openEdit(detailId)});
$("#detailOverlay").addEventListener("click",e=>{if(e.target===$("#detailOverlay"))closeDetail()});
$("#exportBtn").addEventListener("click",exportOverlay);
$("#importBtn").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",e=>{if(e.target.files[0])importOverlay(e.target.files[0]);e.target.value=""});
$("#resetBtn").addEventListener("click",resetOverlay);

setView("g");
loadMaster(false);
</script>
</body>
</html>
