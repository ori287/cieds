<style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--ink:#0f172a;--sub:#475569;--muted:#94a3b8;--teal:#0d9488;--teal-d:#0f766e;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.96);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:2px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.totals{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;background:#eef2f6;border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:var(--sans)}
.seg button.active{background:#fff;color:var(--teal-d);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px 36px;font-size:14px;font-family:var(--sans);outline:none;color:var(--ink)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.searchbox .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px;display:none;line-height:0}
.clearbtn:hover{background:#f1f5f9;color:var(--sub)}
.filterlabel{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:10px 0 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:#94a3b8;background:#f8fafc}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.chip .n{font-family:var(--mono);margin-left:6px;color:var(--muted)}.chip.active .n{color:#ccfbf1}
.chip.dev.active{background:#334155;border-color:#334155}.chip.dev.active .n{color:#cbd5e1}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 12px}
.addbtn{border:0;background:var(--teal);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:var(--sans)}
.addbtn:hover{background:var(--teal-d)}
details.datamenu{position:relative}
details.datamenu>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--sub);padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;user-select:none}
details.datamenu>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:6px;min-width:210px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;font-size:13px;color:var(--ink);border-radius:8px;cursor:pointer;font-family:var(--sans)}
.menu button:hover{background:#f1f5f9}.menu button.danger{color:#be123c}
main{padding:12px 0 40px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 12px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cardrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.term{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.35;margin:0}
.term .abbr{color:var(--teal);margin-left:6px;font-size:13px}
.fn{font-size:15px;font-weight:700;line-height:1.4;margin:0}
.cardtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px;border-radius:6px;line-height:0}
.iconbtn:hover{background:#f1f5f9;color:var(--sub)}
.metarow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10px;font-weight:600;color:#64748b;background:#f1f5f9;border-radius:5px;padding:2px 7px}
.tag.mk{color:#7c2d12;background:#ffedd5}
.en{font-family:var(--mono);font-size:12px;color:var(--muted);margin:5px 0 0}
.short{font-size:14px;line-height:1.6;color:var(--ink);margin:8px 0 0}
.vgrid{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:8px}
.vrow{display:grid;grid-template-columns:6.5em 1fr;gap:8px;padding:4px 0;align-items:baseline}
.vrow+.vrow{border-top:1px solid #f1f5f9}
.vlabel{font-size:11px;font-weight:700;color:var(--teal-d)}
.vval{font-size:13px;line-height:1.5;color:var(--ink)}
.vval.none{color:#cbd5e1}
.note{font-size:12px;line-height:1.6;color:var(--sub);margin:9px 0 0;background:#f8fafc;border-radius:8px;padding:8px 10px}
.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:12px;padding:40px 16px;text-align:center}
.empty p{margin:0}.empty .big{font-size:14px;font-weight:600;color:var(--sub)}.empty .sm{font-size:12px;color:var(--muted);margin-top:4px}
.disclaimer{text-align:center;font-size:12px;line-height:1.7;color:var(--muted);margin-top:32px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:680px){.overlay{align-items:center;padding:16px}.modal{border-radius:16px}}
.modal h2{font-size:16px;margin:0 0 14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;background:#fff}
.field textarea{min-height:60px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.row2{display:flex;gap:8px}.row2 .field{flex:1}
.modalbtns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--sans)}
.btn.primary{background:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;border-color:#cbd5e1;color:var(--sub)}.btn.ghost:hover{background:#f8fafc}
.btn.del{background:#fff;border-color:#fecdd3;color:#be123c;flex:0 0 auto;padding:11px 14px}.btn.del:hover{background:#fff1f2}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f766e;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.syncstat{font-family:var(--mono);font-size:11px;color:#0f766e;margin:-6px 0 12px}.synchelp{font-size:12px;line-height:1.6;color:var(--sub);margin:0 0 10px;background:#f0fdfa;border-radius:8px;padding:9px 10px}.syncstate{font-size:13px;margin:0 0 12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

block;white-space:nowrap;font-size:10px;letter-spacing:.055em;color:var(--teal);margin:5px 0 0;font-weight:700;text-transform:uppercase}.totals{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--sub);border:1px solid #cbe6de;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 11px;white-space:nowrap}.hdrrow{display:flex;align-items:center;gap:12px;margin-top:2px}.hicon-wrap{flex:0 0 auto;line-height:0}.hicon{width:52px;height:52px;display:block;border-radius:50%;box-shadow:0 3px 10px rgba(13,148,136,.28)}.hdrtext{flex:1 1 auto;min-width:0}.hdrtext h1{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.04;color:#12324e;margin:0}.hdrtext .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--teal);margin:4px 0 0;font-weight:700;text-transform:uppercase}header{position:relative}header .wrap{position:relative}.eyebrow{letter-spacing:.12em;font-size:10.5px;font-weight:700;color:var(--teal)}h1{font-size:23px;font-weight:800;letter-spacing:-.015em;line-height:1.05;color:#12324e}.subtitle{font-family:var(--mono);font-size:10.5px;color:#64748b;margin:1px 0 0;letter-spacing:.01em}.titlerow{align-items:flex-start;margin-top:6px}.totals{font-family:var(--mono);font-size:11px;color:var(--sub);border:1px solid var(--border);background:rgba(255,255,255,.75);border-radius:999px;padding:5px 11px;white-space:nowrap}
.eyebrow{letter-spacing:.02em;font-size:11px;margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1;color:#12324e;margin:0}
.titlerow{margin-top:3px;align-items:flex-end}
.totals{font-size:11px}
.suggestbox{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);z-index:45;max-height:min(50vh,340px);overflow:auto;display:none}
.suggestbox.open{display:block}
.sugg{display:flex;align-items:baseline;gap:8px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.sugg:last-child{border-bottom:0}.sugg:active{background:#f0fdfa}
.sugg .st{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink)}
.sugg .sa{font-family:var(--mono);font-size:12px;color:var(--teal)}
.sugg .sc{margin-left:auto;font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}

.cardrow{cursor:pointer}
.short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detailmodal{max-height:88vh;overflow:auto}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dterm{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.3;margin:0}
.dterm .abbr{color:var(--teal);margin-left:8px;font-size:15px}
.dshort{font-size:15px;line-height:1.85;color:var(--ink);margin:12px 0 0;white-space:pre-wrap}
.dnote{font-size:13px;line-height:1.7;color:var(--sub);margin:12px 0 0;background:#f8fafc;border-radius:8px;padding:10px 12px}

.menu{z-index:60}
.sortbar{display:flex;justify-content:flex-end;margin:2px 0 10px}
.sortsel{width:auto;min-width:118px;font-size:13px;font-weight:600;color:var(--sub);padding-top:8px;padding-bottom:8px}
.star{border:0;background:transparent;cursor:pointer;padding:2px;line-height:0;color:#cbd5e1}
.star:hover{color:#94a3b8}.star.on{color:#f59e0b}

.fsel{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 34px 10px 12px;font-size:14px;font-family:var(--sans);color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%2394a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center}
.fsel:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.chkrow{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);border:1px solid #cbd5e1;border-radius:9px;padding:8px 11px;cursor:pointer;user-select:none;background:#fff}
.chk input{accent-color:var(--teal);width:17px;height:17px;margin:0}
.chk input:checked + span{color:var(--teal);font-weight:600}
.hdrrow .hdrtext{flex:0 1 auto;display:inline-block;min-width:0}.hdrtext .eyebrow{display:block;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--teal);margin:5px 0 0}

/* ===== 下部タブバー ===== */
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
 background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(10px);
 border-top:1px solid #e6f2ee;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;padding:7px 2px 6px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
 font-size:10px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
.tabbar button svg{width:21px;height:21px;stroke-width:1.9}
.tabbar button.on{color:var(--teal-d)}
.tabbar button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:8px}
/* ===== 汎用フィルタ ===== */
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fbar .fsel{flex:1 1 44%;min-width:0}
.chipline{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chipline::-webkit-scrollbar{display:none}
.chipline button{white-space:nowrap;border:1px solid var(--border);background:#fff;
 border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
.chipline button.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* ===== 製品・アルゴ・MRIカード ===== */
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;
 padding:13px 14px;margin-bottom:9px}
.pcard h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.35;color:var(--ink)}
.pcard .pmeta{margin:5px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.pcard .pmeta span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
 background:#f1f5f9;color:var(--sub)}
.pcard .pmeta span.mk{background:#ecfdf5;color:var(--teal-d)}
.pcard .pmeta span.warn{background:#fef3c7;color:#92400e}
.pcard dl{margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.pcard dt{color:var(--muted);font-weight:700;white-space:nowrap}
.pcard dd{margin:0;color:var(--ink)}
.pcard .src{margin:9px 0 0;font-size:11px;color:var(--muted)}
.pcard .src a{color:var(--teal-d)}
/* ===== 空状態 ===== */
.blank{border:1px dashed #cbd5e1;border-radius:14px;padding:22px 18px;text-align:center;
 background:#fff;color:var(--sub)}
.blank b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:6px}
.blank p{margin:0;font-size:13px;line-height:1.75}
.blank code{background:#f1f5f9;padding:1px 6px;border-radius:5px;font-size:12px}

/* ===== 背景を固定 ===== */
html{background:#f8fafc;height:100%;overscroll-behavior:none}
body{overscroll-behavior:none;background:transparent;min-height:100%}
/* 上端に引っ張ったときもヘッダーと同じ色を見せる固定レイヤー */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(180deg,#eafaf5 0,#f8fafc 260px)}
/* ヘッダー背景がスクロールでずれないようにする */
header{background-attachment:scroll}

/* ===== アルゴ：モード切替 ===== */
.amode{display:flex;gap:6px;margin:0 0 10px}
.amode button{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;
 padding:8px 4px;font-size:13px;font-weight:800;color:var(--sub);cursor:pointer}
.amode button.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* ===== アルゴ：メーカー見出しと行 ===== */
.mkhead{margin:16px 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;
 text-transform:uppercase;color:var(--teal-d)}
.mkhead:first-child{margin-top:2px}
.arow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--border);border-radius:13px;
 padding:12px 13px;margin-bottom:8px;cursor:pointer}
.arow:active{background:#f8fafc}

ral","short":"心室イベント直後に心房で全く感知しない期間。ファーフィールドR波の誤検出を防ぐ。","tags":"PVAB ブランキング far-field"},{"term":"VRP","en":"Ventricular Refractory Period","abbr":"VRP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベント後、心室感知を計時に反映しない期間。T波やPVCの誤検出を抑える。","tags":"VRP 心室不応期 refractory"},{"term":"ARP","en":"Atrial Refractory Period","abbr":"ARP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房イベント後に設けられる心房の不応期。この間の心房シグナルは計時に反映しない。遠隔R波やペーシング後の残存電位を誤感知しないための保護期間で、PVARPもこの一部にあたる。","tags":"ARP 心房不応期 refractory"},{"term":"動的PVARP","en":"Dynamic / Auto PVARP","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"レートに応じてPVARPを自動で伸縮させる設定。高レートで短縮し追従性を保つ。","tags":"dynamic auto PVARP 動的"},{"term":"心室ブランキング（心房刺激後）","en":"Post-Atrial Ventricular Blanking","abbr":"PAVB","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房刺激直後に心室で感知しない短い窓。クロストーク（心房スパイクの心室誤感知）を防ぐ。","tags":"PAVB crosstalk クロストーク ブランキング"},{"term":"ノイズリバージョン","en":"Noise Reversion","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"連続雑音を感知すると一時的に非同期ペーシングへ切替え、過抑制を防ぐ。","tags":"noise reversion 雑音 非同期 noise reversion DOO VOO AOO 非同期 自己脈識別"},{"term":"レスポンスファクター（スロープ）","en":"Response Factor / Slope","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"活動量に対してどれだけレートを上げるかの傾きの設定。値を大きくすると軽い活動でもレートが上がりやすくなる。センサ感度全体を左右する基本パラメータ。","tags":"response factor slope スロープ 傾き"},{"term":"リアクションタイム","en":"Reaction Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動が始まってからレートが上がり始めるまでの速さの設定。短くすると立ち上がりが機敏になり、長くすると緩やかになる。患者の活動様式に合わせて調整する。","tags":"reaction time 立ち上がり"},{"term":"リカバリータイム","en":"Recovery Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動終了後にレートが下限へ戻るまでの速さの設定。短いと急に戻り、長いと余韻を持って下がる。運動直後の息切れ感などを見て調整する。","tags":"recovery time 回復"},{"term":"活動閾値","en":"Activity Threshold","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答センサが「活動あり」と判定し始める体動レベルのしきい値。低くすると軽い動きにも反応し、高くすると安静時の誤ったレート上昇を抑えられる。","tags":"activity threshold 活動閾値"},{"term":"NCAP","en":"Non-Competitive Atrial Pacing","abbr":"NCAP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房不応期内の自己P波の直後は、少し遅らせて心房刺激し競合を避ける機能。","tags":"NCAP 非競合 心房"},{"term":"PVC反応（PVARP延長）","en":"PVC Response","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室期外収縮を検出するとPVARPを一時延長し、PMTの誘発を防ぐ。","tags":"PVC response PVARP延長 PMT PVC response Premature Ventricular Contraction response PVC Response PVARP延長 PMT予防 CRT 両室ペーシング欠落 OFF"},{"term":"PMT対応","en":"PMT Intervention","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"PMTを検出するとPVARP延長や1拍休止で連鎖を断つ機能。","tags":"PMT intervention 起因性頻拍"},{"term":"心室レート調整（VRR）","en":"Ventricular Rate Regulation","abbr":"VRR","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"心房細動時に心室ペーシングで心室レートの変動を滑らかにする（Conducted AF Response）。","tags":"VRR conducted AF 心室レート"},{"term":"レートドロップ反応","en":"Rate Drop Response","abbr":"RDR","cat":"レート応答","device":"PM","maker":"General","short":"急な徐脈（血管迷走神経性失神など）を検出し、一定時間高めのレートで刺激する。","tags":"rate drop response 迷走神経 失神"},{"term":"心房オーバードライブ","en":"Atrial Preference Pacing","abbr":"APP","cat":"ペーシング","device":"PM","maker":"General","short":"自己P波よりわずかに速く心房刺激し、心房性不整脈の発生を抑える。","tags":"APP overdrive 心房 抑制"},{"term":"検出レート／間隔","en":"Detection Rate / Interval","abbr":"TDI","cat":"ICD","device":"ICD","maker":"General","short":"頻拍と判定するレート（間隔）のしきい値。ゾーンごとに設定する。","tags":"detection rate interval TDI ゾーン detection interval detection rate 検出間隔"},{"term":"検出時間（Duration）","en":"Detection Duration","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"治療前に頻拍が続くべき時間。長めにすると不適切作動・不要治療が減る。","tags":"duration 検出時間 NID"},{"term":"ATPバースト","en":"ATP Burst","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"一定間隔の連続刺激でVTを停止するATP。回数・連結期・刺激数を設定。","tags":"ATP burst バースト Burst Burst ATP"},{"term":"ATPランプ","en":"ATP Ramp","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"刺激間隔を1拍ごとに短縮していく抗頻拍ペーシング。頻拍周期に食い込みながら停止を狙う方式で、バーストと並ぶ代表的なATP。","tags":"ATP ramp ランプ Ramp Ramp ATP"},{"term":"連結期（カップリング）","en":"Coupling Interval","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ATPの最初の刺激を、頻拍周期に対して何%のタイミングで出すかの設定。短くすると頻拍を捕捉しやすいが加速のリスクもあり、停止率と安全性のバランスで決める。","tags":"coupling interval 連結期 ATP S1-S2 coupling interval 期外刺激"},{"term":"ショックエネルギー","en":"Shock Energy","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが放電する電気ショックの出力（J）。初回・2回目以降・最大などを設定し、除細動閾値に十分な安全域をとる。高いほど確実だが充電時間と電池消耗が増える。","tags":"shock energy J 除細動 出力"},{"term":"コミッテッド／ノンコミッテッド","en":"Committed / Non-committed Shock","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"充電後に再確認せず放電するか（committed）、再確認して不要なら中止するか。","tags":"committed noncommitted shock 再確認"},{"term":"SVTリミット","en":"SVT Limit","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"SVT鑑別を適用する上限レート。これを超えると鑑別せず治療する。","tags":"SVT limit 鑑別 上限"},{"term":"VVディレイ","en":"VV Delay","abbr":"VV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"両室ペーシングで右室と左室を刺激する時間差の設定。0〜数十msの範囲で、心エコーやデバイスの最適化アルゴリズムを用いて、左室の同期が最良となる値に調整する。","tags":"VV delay interval 両室 VV delay VVペースディレイ SyncAV LVオフセット V-V delay Interventricular Delay"},{"term":"LV-only／BiV設定","en":"LV-only vs BiV Pacing","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室単独か両室同時かのペーシング設定。AdaptivCRT等で自動切替も。","tags":"LV-only BiV fusion 融合"},{"term":"挿入型心電計（ICM）","en":"Insertable Cardiac Monitor","abbr":"ICM","cat":"フォロー","device":"ICM","maker":"General","short":"皮下に挿入する小型の長期心電図記録計。動悸・失神の原因検索、潜因性脳梗塞の原因精査、発作性心房細動の検出に用いる。最長数年間の連続モニタリングが可能で、不整脈を自動検出するほか、症状時に患者自身が記録できる。","tags":"挿入型心電計（ICM） ICM ICM 挿入型心電計 ループレコーダー ICM ループレコーダー 皮下 3年 ESUS 遠隔モニタリング Reveal LINQ 自動保存"},{"term":"Reveal LINQ / LINQ II","en":"Reveal LINQ II","abbr":"LINQ","cat":"フォロー","device":"ICM","maker":"Medtronic","short":"メドトロニックの挿入型心電計。専用の挿入ツールで低侵襲に留置し、遠隔モニタリング（CareLink）で検出イベントを自動送信する。国内で広く用いられる代表的なICMで、小型・長寿命が特徴。","tags":"Reveal LINQ / LINQ II LINQ ICM 挿入型心電計 ループレコーダー"},{"term":"Confirm Rx / Assert-IQ","en":"Confirm Rx / Assert-IQ","abbr":"","cat":"フォロー","device":"ICM","maker":"Abbott","short":"アボットの挿入型心電計。スマートフォンアプリと連携し、症状の記録やデータ送信を患者側から行えるのが特徴。国内で使用可能で、遠隔フォローに対応する。","tags":"Confirm Rx / Assert-IQ  ICM 挿入型心電計 ループレコーダー"},{"term":"BIOMONITOR","en":"BIOMONITOR","abbr":"","cat":"フォロー","device":"ICM","maker":"BIOTRONIK","short":"バイオトロニックの挿入型心電計。Home Monitoringによる毎日の自動遠隔送信に対応し、大きく明瞭なR波感知を特徴とする。国内で使用可能。","tags":"BIOMONITOR  ICM 挿入型心電計 ループレコーダー"},{"term":"シングルコイル","en":"Single-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端に除細動コイルを1つ持つICDリード。構造が単純で慢性期の抜去が比較的容易。SVCコイルがない分、除細動閾値がやや高くなる場合があるが、現在は多くの症例で十分な有効性が得られる。","tags":"シングルコイル  Single-coil lead"},{"term":"デュアルコイル","en":"Dual-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端とSVC（上大静脈）位置に除細動コイルを2つ持つICDリード。除細動閾値を下げやすい一方、慢性期は癒着でリード抜去がやや難しくなることがある。","tags":"デュアルコイル  Dual-coil lead"},{"term":"高除細動閾値","en":"High DFT","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"確実な除細動に必要なエネルギーが高い状態。コイル位置の調整、SVCコイルのON/OFF、ショック極性の変更、皮下アレイの追加などで対応する。","tags":"高除細動閾値  High DFT 高DFT high DFT High DFT 25J 10J ブルガダ アミオダロン 電解質異常 アシドーシス"},{"term":"受攻性上限試験","en":"Upper Limit of Vulnerability","abbr":"ULV","cat":"ICD","device":"ICD","maker":"General","short":"T波頂上付近に段階的な刺激を与え、心室細動を誘発しない最小エネルギーを求める検査。細動を誘発せずに除細動の安全域を推定できる方法。","tags":"受攻性上限試験 ULV Upper Limit of Vulnerability ULV Upper Limit of Vulnerability T波ピーク 20msec 15J"},{"term":"ショックリダクション","en":"Shock reduction","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"不要・不適切なショックを減らす設定やアルゴリズムの総称。検出遅延の延長、高レートカットオフ、SVT鑑別、T波オーバーセンシング対策などを組み合わせる。","tags":"ショックリダクション  Shock reduction"},{"term":"ミニマムインターバル","en":"Minimum interval","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが心拍として計数する最短の間隔。これより短い信号は雑音などとして扱い、二重計数や過剰検出を避ける。","tags":"ミニマムインターバル  Minimum interval"},{"term":"心室細動","en":"Ventricular fibrillation","abbr":"VF","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室が無秩序に興奮し有効な拍出が失われる致死的不整脈。ICDの主要な治療対象で、検出後に高エネルギーショックで停止させる。","tags":"心室細動 VF Ventricular fibrillation reversible 可逆的要因 虚血 電解質"},{"term":"心室頻拍","en":"Ventricular tachycardia","abbr":"VT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室起源の頻拍。レートや血行動態に応じてATPやショックで治療する。持続性・非持続性、単形性・多形性に分けられる。","tags":"心室頻拍 VT Ventricular tachycardia monomorphic polymorphic sustained non-sustained 単形性 多形性 持続性 非持続性 右脚ブロック型 左脚ブロック型"},{"term":"非持続性心室頻拍","en":"Non-sustained VT","abbr":"NSVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"3連発以上で30秒未満に自然停止する心室頻拍。ICDでは治療されず記録され、リスク評価やフォローの材料になる。","tags":"非持続性心室頻拍 NSVT Non-sustained VT 非持続性VT NSVT Non-sustained VT"},{"term":"トルサード・ド・ポアント","en":"Torsade de pointes","abbr":"TdP","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長を背景に生じる多形性心室頻拍。基線を軸にねじれる波形が特徴で、失神や心室細動へ移行しうる。","tags":"トルサード・ド・ポアント TdP Torsade de pointes TdP 多形性心室頻拍 polymorphic VT QT依存"},{"term":"定電圧方式","en":"Constant voltage output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電圧を保って刺激する出力方式。現在のペースメーカの標準で、リードインピーダンスに応じて流れる電流が変化する。","tags":"定電圧方式  Constant voltage output"},{"term":"定電流方式","en":"Constant current output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電流を保って刺激する出力方式。インピーダンスが変化しても電流が一定になる。旧来の一部機種で用いられた。","tags":"定電流方式  Constant current output"},{"term":"ステップダウン試験","en":"Step-down threshold test","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"出力を段階的に下げていき、捕捉が消える点を探して刺激閾値を求める測定法。","tags":"ステップダウン試験  Step-down threshold test 漸減法 step down 出力漸減 捕捉閾値測定 Capture threshold test 閾値測定（電圧・パルス幅） Threshold measurement"},{"term":"セーフティマージン試験","en":"Safety margin test","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定出力が刺激閾値に対して十分な余裕を持つか確認する試験。通常は閾値の約2倍を目安に安全域をとる。","tags":"セーフティマージン試験  Safety margin test"},{"term":"スルーレート","en":"Slew rate","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"感知波形の立ち上がりの鋭さ（電位の変化速度）。大きいほど鋭く、良好な感知の指標。低いと感知不全の一因になる。","tags":"スルーレート  Slew rate"},{"term":"信号雑音比","en":"Signal-to-noise ratio","abbr":"S/N","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"感知したい心内電位と雑音の比。高いほど自己波を確実に感知でき、オーバーセンシングを避けやすい。","tags":"信号雑音比 S/N Signal-to-noise ratio"},{"term":"単極・双極電位記録法","en":"Unipolar/Bipolar electrogram","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"心内電位を記録する電極構成。双極は近接2電極間で遠隔雑音に強く、単極は缶を対極に用いて広い範囲の電位を捉える。","tags":"単極・双極電位記録法  Unipolar/Bipolar electrogram ユニポーラ バイポーラ unipolar bipolar"},{"term":"相対不応期","en":"Relative refractory period","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"強い刺激なら興奮を起こせるが、伝導や興奮が遅れる期間。絶対不応期に続く回復途上の時期。","tags":"相対不応期  Relative refractory period RRP"},{"term":"有効不応期","en":"Effective refractory period","abbr":"ERP","cat":"不整脈・EP","device":"","maker":"General","short":"期外刺激を与えても伝導がその先へ進まない、最も長い連結期。伝導系の性質を評価する電気生理指標。","tags":"有効不応期 ERP Effective refractory period"},{"term":"機能的不応期","en":"Functional refractory period","abbr":"FRP","cat":"不整脈・EP","device":"","maker":"General","short":"ある部位を通過して出てくる興奮の最短間隔。その部位の伝導能を表す電気生理指標。","tags":"機能的不応期 FRP Functional refractory period"},{"term":"補充調律","en":"Escape rhythm","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"上位のペースメーカが止まったとき、下位（房室接合部や心室）が肩代わりして出す調律。徐脈時の生命維持に働く。","tags":"補充調律  Escape rhythm 接合部補充調律 心室補充調律 junction"},{"term":"リエントリー","en":"Reentry","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"興奮が旋回して持続する不整脈の主要機序。瘢痕や副伝導路を旋回路とし、多くのVT・SVTの原因になる。","tags":"リエントリー  Reentry reentry 一方向性ブロック 緩徐伝導"},{"term":"心房細動","en":"Atrial fibrillation","abbr":"AF","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房が無秩序に興奮し、心室応答が不規則になる不整脈。デバイスではモードスイッチや心房頻拍記録の対象で、抗凝固の判断にも関わる。","tags":"心房細動 AF Atrial fibrillation paroxysmal persistent permanent 発作性 持続性 永続性 両室ペーシング欠落 CRT 房室結節アブレーション 新規発症 植込み後2.5年 10%"},{"term":"心房粗動","en":"Atrial flutter","abbr":"AFL","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房内の旋回興奮による規則的な頻拍。1:1伝導では速い心室応答となり、デバイスの心房追従にも影響する。","tags":"心房粗動 AFL Atrial flutter AFL 通常型 非通常型 Wells Wells 反時計回転 時計回転 鋸歯状"},{"term":"心房頻拍","en":"Atrial tachycardia","abbr":"AT","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の規則的な頻拍。デバイスはこれを検出してモードスイッチや心房ATPで対応する。","tags":"心房頻拍 AT Atrial tachycardia AT focal マクロリエントリー AT isoelectric line 等電位線 特発性 続発性"},{"term":"上室頻拍","en":"Supraventricular tachycardia","abbr":"SVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心房・房室接合部起源の頻拍の総称。ICDではVTとの鑑別が重要で、鑑別を誤ると不適切作動の原因になる。","tags":"上室頻拍 SVT Supraventricular tachycardia SVT PSVT 発作性上室頻拍 paroxysmal"},{"term":"上室期外収縮","en":"Premature atrial contraction","abbr":"PAC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の早期収縮。頻発すると心房頻拍・心房細動の引き金になりうる。","tags":"上室期外収縮 PAC Premature atrial contraction APC PAC APC 心房期外収縮 atrial premature contraction"},{"term":"心室期外収縮","en":"Premature ventricular contraction","abbr":"PVC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心室起源の早期収縮。デバイスはこれを感知してPVARP延長などで対応し、PMTの予防にも関わる。","tags":"心室期外収縮 PVC Premature ventricular contraction VPC PVC 期外収縮 特発性 器質的 scar 瘢痕 多源性"},{"term":"ディスシンクロニー","en":"Dyssynchrony","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"心室内・心室間の収縮タイミングのずれ。左脚ブロックなどで生じ、CRTの適応と効果判定の中心概念。","tags":"ディスシンクロニー  Dyssynchrony 心室同期不全 dyssynchrony"},{"term":"心室内伝導障害","en":"Intraventricular conduction disturbance","abbr":"IVCD","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"脚や末梢の伝導障害でQRSが幅広くなる状態。左脚ブロック型はCRTの良い適応となりうる。","tags":"心室内伝導障害 IVCD Intraventricular conduction disturbance"},{"term":"脚ブロック","en":"Bundle branch block","abbr":"BBB","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"右脚または左脚の伝導障害。左脚ブロックは心室同期障害を来し、CRTの効果が期待できる。","tags":"脚ブロック BBB Bundle branch block"},{"term":"高度房室ブロック","en":"Advanced AV block","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"連続する複数のP波が心室へ伝わらない重い房室ブロック。症候性なら恒久ペーシングの適応となる。","tags":"高度房室ブロック  Advanced AV block"},{"term":"洞房ブロック","en":"Sinoatrial block","abbr":"SA block","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節の興奮が心房へ伝わらず、心房興奮が欠落する状態。洞不全症候群の一型。","tags":"洞房ブロック SA block Sinoatrial block"},{"term":"洞性徐脈","en":"Sinus bradycardia","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節由来で心拍が遅い状態。症候性であれば恒久ペーシングの適応になりうる。","tags":"洞性徐脈  Sinus bradycardia"},{"term":"血管迷走神経性失神","en":"Vasovagal syncope","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"迷走神経反射による一過性の徐脈・血圧低下で起こる失神。心停止型ではレートドロップ反応などのペーシングが検討される。","tags":"血管迷走神経性失神  Vasovagal syncope vasovagal tilt"},{"term":"頸動脈洞症候群","en":"Carotid sinus syndrome","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"頸動脈洞への刺激で強い徐脈・血圧低下を来す病態。心抑制型はペーシングの適応になりうる。","tags":"頸動脈洞症候群  Carotid sinus syndrome carotid sinus 過敏性頸動脈洞"},{"term":"QT延長症候群","en":"Long QT syndrome","abbr":"LQTS","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長によりTdPや突然死のリスクが高まる病態。二次予防や高リスク例でICDが考慮される。","tags":"QT延長症候群 LQTS Long QT syndrome LQTS Romano-Ward Jervell-Lange-Nielsen LQT1 LQT2 LQT3 LQT1 LQT2 LQT3 KCNQ1 KCNH2 SCN5A メキシレチン ナドロール"},{"term":"ブルガダ症候群","en":"Brugada syndrome","abbr":"","cat":"不整脈・EP","device":"ICD","maker":"General","short":"右側胸部誘導の特徴的ST上昇を示し、心室細動・突然死を来しうる遺伝性不整脈。適応例でICDが用いられる。","tags":"ブルガダ症候群  Brugada syndrome Brugada coved saddleback SCN5A coved saddle back type1 type2 ピルジカイニド ボックリ病 High DFT 高除細動閾値"},{"term":"カテコラミン誘発性多形性心室頻拍","en":"CPVT","abbr":"CPVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"運動や情動で多形性VTを生じる遺伝性不整脈。薬物治療を基本とし、高リスク例でICDを併用する。","tags":"カテコラミン誘発性多形性心室頻拍 CPVT CPVT CPVT CPVT Catecholaminergic polymorphic VT"},{"term":"肥大型心筋症","en":"Hypertrophic cardiomyopathy","abbr":"HCM","cat":"不整脈・EP","device":"ICD","maker":"General function renderSuggest(){

 list.forEach(t=>{
  const hay=[nm(t),t.abbr,t.en,t.tags].map(x=>(x||"").toLowerCase());
  const hayN=hay.map(normQ);
  let s=-1;
  for(let i=0;i<hay.length;i++){const idx=hay[i].indexOf(q);if(idx>=0){s=i*1000+(hay[i].startsWith(q)?0:idx+1);break}}
  if(s<0){const raw=[nm(t),t.abbr,t.en,t.tags];outer:for(let i=0;i<raw.length;i++){for(const qq of qs){if(tokHit(raw[i],qq)){s=i*1000+500;break outer}}}}

  if(isRelated){scored.push([-100000+(s>=0?0:1),t]);}
  else if(s>=0){scored.push([s,t])}
 });
 scored.sort((a,b)=>a[0]-b[0]);const top=scored.slice(0,8);

<script>
(function(){
  function textW(el){
    var r=document.createRange(); r.selectNodeContents(el);
    var rects=r.getClientRects(), w=0;
    for(var i=0;i<rects.length;i++){ w=Math.max(w,rects[i].width); }
    return w||r.getBoundingClientRect().width;
  }
  function fitEyebrow(){
    var box=document.querySelector('.hdrrow .hdrtext');
    if(!box) return;
    var h1=box.querySelector('h1'), eb=box.querySelector('.eyebrow');
    if(!h1||!eb) return;
    var target=textW(h1);
    if(!target) return;
    var n=(eb.textContent||'').length; if(!n) return;
    var fs=11;
    eb.style.letterSpacing='0px';
    eb.style.marginRight='0px';
    eb.style.fontSize=fs+'px';
    var w=textW(eb), guard=0;
    while(w>target && fs>8 && guard++<40){
      fs-=0.25; eb.style.fontSize=fs+'px'; w=textW(eb);
    }
    var ls=(target-w)/n;
    if(ls>0){
      eb.style.letterSpacing=ls.toFixed(3)+'px';
      eb.style.marginRight=(-ls).toFixed(3)+'px';
    }
  }
  window.fitEyebrow=fitEyebrow;
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',fitEyebrow);}else{fitEyebrow();}
  window.addEventListener('resize',fitEyebrow);
  window.addEventListener('orientationchange',function(){setTimeout(fitEyebrow,150);});
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitEyebrow);}
  setTimeout(fitEyebrow,300); setTimeout(fitEyebrow,1200);
})();
</script>

<script>
/* ================= 拡張タブ（製品／アルゴ／MRI） ================= */
(function(){
 var $=function(s){return document.querySelector(s)};
 var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
 var CK="ciedsnavi.ext.";           /* キャッシュ接頭辞 */
 var cache={}, loaded={};

 function readCache(name){try{return JSON.parse(localStorage.getItem(CK+name)||"null")}catch(e){return null}}
 function writeCache(name,d){try{localStorage.setItem(CK+name,JSON.stringify(d))}catch(e){}}

 /* 必要になったタブのデータだけ取りに行く */
 async function load(name){
  if(loaded[name])return cache[name];
  var c=readCache(name); if(c){cache[name]=c;}
  try{
   var r=await fetch(name+".json?t="+Date.now(),{cache:"no-store"});
   if(r.ok){var d=await r.json(); cache[name]=d; writeCache(name,d);}
  }catch(e){/* オフラインならキャッシュのまま */}
  loaded[name]=true;
  return cache[name]||{items:[]};
 }
 function items(name){return (cache[name]&&cache[name].items)||[]}

 /* --- 絞り込みの部品 --- */
 function fillSel(el,label,vals,cur){
  el.innerHTML='<option value="">'+label+'</option>'+
   vals.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join("");
 }
 function uniq(list,key){
  var s=[]; list.forEach(function(x){if(x[key]&&s.indexOf(x[key])<0)s.push(x[key])});
  return s.sort();
 }
 function chips(el,vals,cur,onPick){
  el.innerHTML=['すべて'].concat(vals).map(function(v){
   var on=(v==='すべて'?!cur:v===cur);
   return '<button'+(on?' class="on"':'')+' data-v="'+esc(v)+'">'+esc(v)+'</button>'}).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){
   b.onclick=function(){onPick(b.dataset.v==='すべて'?"":b.dataset.v)}});
 }
 function blank(name,tmpl){
  return '<div class="blank"><b>まだデータがありません</b><p>'+
   '<code>'+tmpl+'</code> に記入し、<br><code>import_csv.py</code> で '+
   '<code>'+name+'.json</code> を作って同じ階層に置いてください。</p></div>';
 }
 /* 出典はデータとして保持するが画面には表示しない */
 function srcLine(x){return ""}
 function dl(pairs){
  var r=pairs.filter(function(p){return p[1]}).map(function(p){
   return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>'}).join("");
  return r?'<dl>'+r+'</dl>':'';
 }

 /* ================= 製品（デバイス＋リード） ================= */
 var pK="",pM="",pC="";
 function renderP(){
  var all=items("products");
  var cats=uniq(all.filter(function(x){return !pK||x.kind===pK}),"cat");
  fillSel($("#pKind"),"本体・リード",["device","lead"],pK);
  $("#pKind").querySelectorAll("option").forEach(function(o){
   if(o.value==="device")o.textContent="本体のみ"; if(o.value==="lead")o.textContent="リードのみ"});
  fillSel($("#pMaker"),"すべてのメーカー",uniq(all,"maker"),pM);
  chips($("#pCats"),cats,pC,function(v){pC=v;renderP()});
  var rows=all.filter(function(x){
   return (!pK||x.kind===pK)&&(!pM||x.maker===pM)&&(!pC||x.cat===pC)});
  $("#pCount").textContent=all.length?rows.length+" 件":"";
  $("#pList").innerHTML=all.length?(rows.map(function(x){
   return '<div class="pcard"><h3>'+esc(x.name)+'</h3>'+
    '<div class="pmeta"><span class="mk">'+esc(x.maker)+'</span>'+
    '<span>'+esc(x.cat)+'</span>'+(x.model?'<span>'+esc(x.model)+'</span>':'')+
    (x.mri?'<span>'+esc(x.mri)+'</span>':'')+
    (x.status&&x.status!=="販売中"?'<span class="warn">'+esc(x.status)+'</span>':'')+'</div>'+
    dl(x.kind==="lead"
      ?[["固定",x.fixation],["極性",x.polarity],["有効長",x.length&&x.length+" cm"],
        ["外径",x.diameter&&x.diameter+" Fr"],["コイル",x.coil],["コネクタ",x.connector],["備考",x.note]]
      :[["シリーズ",x.series],["コネクタ",x.connector],["寿命",x.longevity&&x.longevity+" 年"],
        ["容積",x.volume&&x.volume+" cc"],["質量",x.weight&&x.weight+" g"],
        ["最大出力",x.energy&&x.energy+" J"],["備考",x.note]])+
    srcLine(x)+'</div>'}).join("")||'<p class="count">該当なし</p>')
   :blank("products","template_products.csv");
 }

 /* ================= アルゴリズム ================= */
 /* メーカー別（algos.json）とメーカー対比表（22機能）を1タブで扱う */
 var aM="",aC="",aMode="m",aOpen=null;
 var VEND=[["mdt","Medtronic"],["abt","Abbott"],["bsx","Boston Scientific"],
           ["bio","BIOTRONIK"],["mcp","MicroPort"]];
 var GEAR='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>';
 var CHEV='<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 5.5 6L1 13"/></svg>';

 function featRows(){
  var src=(typeof fList==="function")?fList():[];
  return src.map(function(m){
   var mk={}; VEND.forEach(function(v){var val=m[v[0]];if(val&&val!=="—")mk[v[1]]=val});
   return {name:m.fn,en:m.en,cat:m.cat,note:m.note,makers:mk};
  });
 }

 /* --- メーカー別の一覧 --- */
 function renderAList(){
  var all=items("algos");
  fillSel($("#aMaker"),"すべてのメーカー",uniq(all,"maker"),aM);
  fillSel($("#aCat"),"すべての分類",uniq(all,"cat"),aC);
  var rows=all.filter(function(x){return (!aM||x.maker===aM)&&(!aC||x.cat===aC)});
  $("#aCount").textContent=all.length?rows.length+" 件":"";
  if(!all.length){$("#aList").innerHTML=blank("algos","template_algos.csv");return}
  if(!rows.length){$("#aList").innerHTML='<p class="count">該当なし</p>';return}
  var order=VEND.map(function(v){return v[1]});
  rows.sort(function(a,b){
   var d=order.indexOf(a.maker)-order.indexOf(b.maker);
   return d||String(a.name).localeCompare(String(b.name),"ja")});
  var out="",cur=null;
  rows.forEach(function(x){
   if(x.maker!==cur){cur=x.maker;out+='<p class="mkhead">'+esc(cur)+'</p>'}
   var sum=x.scope||x.purpose||"";
   out+='<button class="arow" data-id="'+esc(x.id)+'">'+GEAR+
    '<span class="atxt"><b>'+esc(x.name)+'</b><small>'+esc(x.maker)+
    (x.cat?' ・ '+esc(x.cat):'')+'</small>'+
    (sum?'<em>'+esc(sum)+'</em>':'')+'</span>'+CHEV+'</button>';
  });
  $("#aList").innerHTML=out;
 }

 /* --- 対比表 --- */
 function renderACompare(){
  var all=featRows();
  fillSel($("#aMaker"),"すべてのメーカー",
   VEND.map(function(v){return v[1]}).filter(function(n){
    return all.some(function(x){return x.makers[n]})}),aM);
  fillSel($("#aCat"),"すべての分類",uniq(all,"cat"),aC);
  var rows=all.filter(function(x){
   return (!aC||x.cat===aC)&&(!aM||!!x.makers[aM])});
  $("#aCount").textContent=rows.length+" 件";
  $("#aList").innerHTML=rows.length?rows.map(function(x){
   var ks=Object.keys(x.makers).filter(function(k){return !aM||k===aM});
   return '<div class="pcard"><h3>'+esc(x.name)+'</h3>'+
    (x.en?'<p class="src" style="margin-top:3px">'+esc(x.en)+'</p>':'')+
    '<div class="pmeta"><span>'+esc(x.cat)+'</span><span class="mk">'+ks.length+'社</span></div>'+
    dl(ks.map(function(k){return [k,x.makers[k]]}))+
    (x.note?'<p class="src" style="color:var(--sub)">'+esc(x.note)+'</p>':'')+
    '</div>'}).join(""):'<p class="count">該当なし</p>';
 }

 /* --- 詳細 --- */
 function openAlgo(id){
  var x=items("algos").filter(function(a){return a.id===id})[0]; if(!x)return;
  aOpen=id;
  var kv=[["メーカー",x.maker],["分類",x.cat],["対象",x.device],
          ["一般名称",x.generic],["目的",x.scope||x.purpose]]
   .filter(function(p){return p[1]})
   .map(function(p){return '<div><dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd></div>'}).join("");
  var params=(x.params||"").split(/\n|；|;/).map(function(s){return s.trim()}).filter(Boolean);
  $("#aDetail").innerHTML=
   '<button class="back" id="aBack">‹ アルゴリズム一覧</button>'+
   '<h2>'+esc(x.name)+'</h2>'+
   '<dl class="kv">'+kv+'</dl>'+
   (x.how?'<section><h4>動作</h4><p class="body">'+esc(x.how)+'</p></section>':'')+
   (params.length?'<section><h4>設定項目</h4><ul class="par">'+
     params.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul></section>':'')+
   (x.pathway?'<section><h4>プログラマ操作</h4><p class="path">'+esc(x.pathway)+'</p></section>':'')+
   (x.caution?'<section><h4>注意点</h4><p class="body">'+esc(x.caution)+'</p></section>':'')+
   (x.glossary?'<section><h4>関連用語</h4><p class="body">'+esc(x.glossary)+'</p></section>':'')+
   '';
  $("#aBrowse").hidden=true; $("#aDetail").hidden=false; window.scrollTo(0,0);
 }
 function closeAlgo(){aOpen=null;$("#aDetail").hidden=true;$("#aBrowse").hidden=false}

 function renderA(){
  if(aOpen){openAlgo(aOpen);return}
  $("#aBrowse").hidden=false; $("#aDetail").hidden=true;
  $("#aModeM").classList.toggle("on",aMode==="m");
  $("#aModeC").classList.toggle("on",aMode==="c");
  if(aMode==="m")renderAList(); else renderACompare();
 }

 /* 詳細を右スワイプで閉じる */
 (function(){
  var x0=0,y0=0,t0=0,track=false;
  function detailOpen(){
   var el=document.getElementById("aDetail");
   return el && !el.hidden;
  }
  function start(x,y){x0=x;y0=y;t0=Date.now();track=true}
  function move(x,y){
   if(!track)return;
   var dx=x-x0, dy=y-y0;
   if(Math.abs(dy)>Math.abs(dx)*1.2){track=false;setX(0);return}  /* 縦優先 */
   setX(dx>0?dx*0.3:0);
  }
  function end(x,y){
   var el=document.getElementById("aDetail");
   setX(0);
   if(!track)return; track=false;
   var dx=x-x0, dy=y-y0, dt=Date.now()-t0;
   if(dx>55 && Math.abs(dx)>Math.abs(dy)*1.2 && dt<1200 && typeof closeAlgo==="function")closeAlgo();
  }
  function setX(px){
   var el=document.getElementById("aDetail"); if(!el)return;
   el.style.transform = px ? "translateX("+px+"px)" : "";
  }
  document.addEventListener("touchstart",function(e){
   if(!detailOpen()||e.touches.length!==1){track=false;return}
   start(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
   if(!detailOpen()||e.touches.length!==1)return;
   move(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener("touchend",function(e){
   if(!detailOpen())return;
   var t=e.changedTouches[0]; end(t.clientX,t.clientY);
  },{passive:true});
  document.addEventListener("touchcancel",function(){track=false;setX(0)},{passive:true});
  /* マウス環境でも同じ操作で戻れるように */
  document.addEventListener("pointerdown",function(e){
   if(e.pointerType!=="mouse"||!detailOpen())return;
   start(e.clientX,e.clientY);
  });
  document.addEventListener("pointerup",function(e){
   if(e.pointerType!=="mouse"||!detailOpen())return;
   end(e.clientX,e.clientY);
  });
 })();
 document.addEventListener("click",function(e){
  if(e.target.closest("#aModeM")){aMode="m";aM="";aC="";renderA();return}
  if(e.target.closest("#aModeC")){aMode="c";aM="";aC="";renderA();return}
  if(e.target.closest("#aBack")){closeAlgo();return}
  var r=e.target.closest(".arow"); if(r)openAlgo(r.dataset.id);
 });

 /* ================= MRI ================= */
 var mM="",mT="",mC="";
 function renderM(){
  var all=items("mri");
  fillSel($("#mMaker"),"すべてのメーカー",uniq(all,"maker"),mM);
  fillSel($("#mTesla"),"すべての磁場強度",uniq(all,"tesla"),mT);
  chips($("#mCats"),uniq(all,"cat"),mC,function(v){mC=v;renderM()});
  var rows=all.filter(function(x){
   return (!mM||x.maker===mM)&&(!mT||x.tesla===mT)&&(!mC||x.cat===mC)});
  $("#mCount").textContent=all.length?rows.length+" 件":"";
  $("#mList").innerHTML=all.length?(rows.map(function(x){
   return '<div class="pcard"><h3>'+esc(x.system||x.device_model)+'</h3>'+
    '<div class="pmeta"><span class="mk">'+esc(x.maker)+'</span><span>'+esc(x.cat)+'</span>'+
    (x.tesla?'<span>'+esc(x.tesla)+'</span>':'')+
    (x.region?'<span>'+esc(x.region)+'</span>':'')+'</div>'+
    dl([["本体",x.device_model],["適合リード",x.lead_model],["撮像部位",x.region],
        ["SAR",x.sar],["スルーレート",x.slew],["待機期間",x.wait],
        ["条件",x.condition],["除外",x.exclusion],["モード",x.mode]])+
    srcLine(x)+'</div>'}).join("")||'<p class="count">該当なし</p>')
   :blank("mri","template_mri.csv");
 }

 /* ================= タブ切替 ================= */
 var SEC={g:null,p:"#secProducts",a:"#secAlgos",m:"#secMri"};
 var GLOSS=["header","main.wrap:not([id])",".overlay"];
 async function go(tab){
  /* 用語集の既存UI（ヘッダー内の検索・並べ替え等）は用語集タブのみ表示 */
  var head=document.querySelector("header");
  var gmain=document.querySelector('main.wrap:not([id])');
  if(head)head.style.display=(tab==="g")?"":"none";
  if(tab==="g"&&typeof setView==="function"&&view!=="g")setView("g");
  if(gmain)gmain.hidden=(tab!=="g");
  ["p","a","m"].forEach(function(k){var el=$(SEC[k]);if(el)el.hidden=(tab!==k)});
  Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"),function(b){
   var on=b.dataset.tab===tab; b.classList.toggle("on",on); b.setAttribute("aria-selected",on)});
  window.scrollTo(0,0);
  if(tab==="p"){await load("products");renderP()}
  if(tab==="a"){await load("algos");if(tab!=="a")aOpen=null;renderA()}
  if(tab==="m"){await load("mri");renderM()}
 }
 document.addEventListener("click",function(e){
  var b=e.target.closest("#tabbar button"); if(b)go(b.dataset.tab)});
 ["#pKind","#pMaker"].forEach(function(s){
  document.addEventListener("change",function(e){
   if(e.target.matches("#pKind")){pK=e.target.value;pC="";renderP()}
   if(e.target.matches("#pMaker")){pM=e.target.value;renderP()}
   if(e.target.matches("#aMaker")){aM=e.target.value;renderA()}
   if(e.target.matches("#aCat")){aC=e.target.value;renderA()}
   if(e.target.matches("#mMaker")){mM=e.target.value;renderM()}
   if(e.target.matches("#mTesla")){mT=e.target.value;renderM()}
  })});
})();
</script>

<script>
/* オーバーレイの開閉に合わせて body にクラスを付け外しする */
(function(){
 var ids=["#overlay","#detailOverlay"];
 function sync(){
  var open=ids.some(function(s){var el=document.querySelector(s);
   return el&&(el.classList.contains("open")||getComputedStyle(el).display!=="none")});
  document.body.classList.toggle("modal-open",open);
 }
 ids.forEach(function(s){
  var el=document.querySelector(s); if(!el)return;
  new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:["class","style"]});
 });
 document.addEventListener("click",function(){setTimeout(sync,0)},true);
 sync();
})();
</script>

<script>
/* ピンチ／ダブルタップによる拡大を抑止（iOS Safari対策） */
(function(){
 document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});
 document.addEventListener("gesturechange",function(e){e.preventDefault()},{passive:false});
 document.addEventListener("gestureend",function(e){e.preventDefault()},{passive:false});
 document.addEventListener("touchmove",function(e){
  if(e.touches&&e.touches.length>1){e.preventDefault()}
 },{passive:false});
})();
</script>
